<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>New Space | Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="site-head" id="head"></header>
<main class="wrap narrow" id="app">
  <div class="card"><span class="spinner"></span></div>
</main>
<script src="assets/core.js"></script>
<script>
(function () {
  "use strict";
  var NS = window.NS;
  var sb = NS.sb;
  var t = NS.t;
  var app = NS.$("#app");
  var mode = "login";
  var recovery = false;
  var me = null;
  var busy = false;

  NS.extendDict({
    ar: {
      login: "تسجيل الدخول",
      register: "حساب جديد",
      email: "البريد الإلكتروني",
      password: "كلمة المرور",
      fullName: "الاسم الكامل",
      phone: "رقم الجوال",
      signIn: "دخول",
      create: "إنشاء الحساب",
      forgot: "نسيت كلمة المرور؟",
      resetSent: "أُرسل رابط استعادة كلمة المرور إلى بريدك.",
      checkMail: "تم إنشاء الحساب. إن طُلب تأكيد البريد فافتح الرسالة ثم سجّل الدخول.",
      needEmail: "اكتب بريدك الإلكتروني أولاً.",
      newPassword: "كلمة المرور الجديدة",
      save: "حفظ",
      passShort: "كلمة المرور 8 أحرف على الأقل.",
      passMismatch: "كلمتا المرور غير متطابقتين.",
      confirmPassword: "تأكيد كلمة المرور",
      pendingTitle: "طلبك قيد المراجعة",
      pendingText: "تم إنشاء حسابك كموظف. سيراجع المدير طلبك، وتظهر لوحتك بعد الموافقة.",
      rejectedTitle: "تم رفض الطلب",
      suspendedTitle: "الحساب موقوف",
      reason: "السبب",
      refresh: "تحديث الحالة",
      welcome: "مرحباً",
      recoveryTitle: "تعيين كلمة مرور جديدة",
      roleNote: "يُسجَّل الحساب الجديد كموظف دائماً. لا يمكن اختيار الدور عند التسجيل.",
      showPass: "إظهار كلمة المرور",
      hidePass: "إخفاء كلمة المرور",
      credentials: "بيانات الدخول غير صحيحة.",
      fillAll: "أكمل جميع الحقول المطلوبة.",
      emailBad: "صيغة البريد الإلكتروني غير صحيحة.",
      profileMissing: "لا يوجد سجل ملف شخصي لهذا الحساب. تأكد من تنفيذ supabase/schema.sql ثم سجّل الخروج والدخول مرة أخرى.",
    },
    en: {
      login: "Sign in",
      register: "New account",
      email: "Email",
      password: "Password",
      fullName: "Full name",
      phone: "Mobile number",
      signIn: "Sign in",
      create: "Create account",
      forgot: "Forgot password?",
      resetSent: "A password reset link was sent to your email.",
      checkMail: "Account created. If email confirmation is required, open the message, then sign in.",
      needEmail: "Enter your email first.",
      newPassword: "New password",
      save: "Save",
      passShort: "Password must be at least 8 characters.",
      passMismatch: "Passwords do not match.",
      confirmPassword: "Confirm password",
      pendingTitle: "Your application is under review",
      pendingText: "Your account was created as staff. An administrator will review it; your dashboard appears once approved.",
      rejectedTitle: "Application rejected",
      suspendedTitle: "Account suspended",
      reason: "Reason",
      refresh: "Refresh status",
      welcome: "Welcome",
      recoveryTitle: "Set a new password",
      roleNote: "New accounts are always registered as staff. The role cannot be chosen at signup.",
      showPass: "Show password",
      hidePass: "Hide password",
      credentials: "Invalid sign-in details.",
      fillAll: "Fill in all required fields.",
      emailBad: "Email format is invalid.",
      profileMissing: "Your account has no profile row. Make sure supabase/schema.sql was run, then sign out and in again.",
    },
  });

  function render() {
    NS.mountHeader(me);
    if (recovery) return viewRecovery();
    if (!me) return viewAuth();
    if (!NS.APPROVED.includes(me.status)) return viewStatus();
    location.replace(NS.homeFor(me));
  }

  function viewAuth() {
    var reg = mode === "register";
    app.innerHTML =
      '<div class="card">' +
      '<div class="tabs" role="tablist">' +
      '<button class="tab" role="tab" type="button" aria-selected="' + (!reg) + '" data-mode="login">' + NS.esc(t("login")) + "</button>" +
      '<button class="tab" role="tab" type="button" aria-selected="' + reg + '" data-mode="register">' + NS.esc(t("register")) + "</button>" +
      "</div>" +
      '<form id="authForm" novalidate>' +
      (reg
        ? '<div class="field"><label for="fullName">' + NS.esc(t("fullName")) + '</label><input id="fullName" autocomplete="name" required maxlength="120"></div>' +
          '<div class="field"><label for="phone">' + NS.esc(t("phone")) + '</label><input id="phone" type="tel" autocomplete="tel" required maxlength="30"></div>'
        : "") +
      '<div class="field"><label for="email">' + NS.esc(t("email")) + '</label><input id="email" type="email" autocomplete="email" required></div>' +
      '<div class="field"><label for="password">' + NS.esc(t("password")) + '</label>' +
      '<input id="password" type="password" autocomplete="' + (reg ? "new-password" : "current-password") + '" required minlength="8"></div>' +
      (reg
        ? '<div class="field"><label for="password2">' + NS.esc(t("confirmPassword")) + '</label><input id="password2" type="password" autocomplete="new-password" required minlength="8"></div>'
        : "") +
      '<div class="row between">' +
      '<button class="btn" id="submit" type="submit">' + NS.esc(reg ? t("create") : t("signIn")) + "</button>" +
      (reg ? "" : '<button class="btn ghost sm" id="forgot" type="button">' + NS.esc(t("forgot")) + "</button>") +
      "</div>" +
      '<div id="msg" class="alert error" role="alert" hidden></div>' +
      (reg ? '<p class="note" style="margin-top:.8rem">' + NS.esc(t("roleNote")) + "</p>" : "") +
      "</form></div>";

    NS.$$("[data-mode]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (busy) return;
        mode = b.dataset.mode;
        viewAuth();
      });
    });

    var forgot = NS.$("#forgot");
    if (forgot) {
      forgot.addEventListener("click", async function () {
        var email = (NS.$("#email").value || "").trim();
        if (!email) return say(t("needEmail"));
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say(t("emailBad"));
        forgot.disabled = true;
        var res = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: location.href.split("#")[0],
        });
        forgot.disabled = false;
        say(res.error ? res.error.message : t("resetSent"), !res.error);
      });
    }

    NS.$("#authForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (busy) return;
      var email = (NS.$("#email").value || "").trim();
      var password = NS.$("#password").value || "";
      if (!email || !password) return say(t("fillAll"));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say(t("emailBad"));
      if (reg && password.length < 8) return say(t("passShort"));
      if (reg && password !== NS.$("#password2").value) return say(t("passMismatch"));

      busy = true;
      var btn = NS.$("#submit");
      btn.disabled = true;
      var res;
      if (reg) {
        var fullName = (NS.$("#fullName").value || "").trim();
        var phone = (NS.$("#phone").value || "").trim();
        if (!fullName || !phone) {
          busy = false;
          btn.disabled = false;
          return say(t("fillAll"));
        }
        res = await sb.auth.signUp({
          email: email,
          password: password,
          options: { data: { full_name: fullName, phone: phone } },
        });
      } else {
        res = await sb.auth.signInWithPassword({ email: email, password: password });
      }
      busy = false;
      btn.disabled = false;
      if (res.error) return say(res.error.message);
      if (reg && !res.data.session) {
        mode = "login";
        viewAuth();
        return say(t("checkMail"), true);
      }
      await boot();
    });
  }

  function viewRecovery() {
    app.innerHTML =
      '<div class="card"><h1>' + NS.esc(t("recoveryTitle")) + "</h1>" +
      '<form id="resetForm" novalidate>' +
      '<div class="field"><label for="password">' + NS.esc(t("newPassword")) + "</label>" +
      '<input id="password" type="password" autocomplete="new-password" minlength="8" required></div>' +
      '<div class="field"><label for="password2">' + NS.esc(t("confirmPassword")) + "</label>" +
      '<input id="password2" type="password" autocomplete="new-password" minlength="8" required></div>' +
      '<button class="btn" id="submit" type="submit">' + NS.esc(t("save")) + "</button>" +
      '<div id="msg" class="alert error" role="alert" hidden></div>' +
      "</form></div>";

    NS.$("#resetForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (busy) return;
      var password = NS.$("#password").value || "";
      if (password.length < 8) return say(t("passShort"));
      if (password !== NS.$("#password2").value) return say(t("passMismatch"));
      busy = true;
      NS.$("#submit").disabled = true;
      var res = await sb.auth.updateUser({ password: password });
      busy = false;
      NS.$("#submit").disabled = false;
      if (res.error) return say(res.error.message);
      recovery = false;
      if (history.replaceState) history.replaceState(null, "", location.pathname);
      NS.toast(t("saved"));
      await boot();
    });
  }

  async function viewStatus() {
    var title =
      me.status === "pending" ? t("pendingTitle")
      : me.status === "rejected" ? t("rejectedTitle")
      : t("suspendedTitle");
    var urls = await NS.avatarUrls([me]);

    app.innerHTML =
      '<div class="card">' +
      '<div class="row" style="margin-bottom:.6rem">' +
      NS.avatarHtml(me.full_name, urls[me.id] || null) +
      "<div><b>" + NS.esc(me.full_name || me.email || "") + "</b><br>" +
      '<span class="note">' + NS.esc(NS.roleLabel(me.role)) + " · " + NS.esc(NS.statusLabel(me.status)) + "</span></div></div>" +
      "<h1>" + NS.esc(title) + "</h1>" +
      (me.status === "pending" ? '<p class="muted">' + NS.esc(t("pendingText")) + "</p>" : "") +
      (me.rejection_reason
        ? '<div class="alert error"><b>' + NS.esc(t("reason")) + ":</b> " + NS.esc(me.rejection_reason) + "</div>"
        : "") +
      '<div class="row" style="margin-top:1rem">' +
      '<button class="btn ghost" id="refresh" type="button">' + NS.esc(t("refresh")) + "</button>" +
      '<button class="btn danger" id="logout" type="button">' + NS.esc(t("signOut")) + "</button>" +
      "</div></div>";

    NS.$("#refresh").addEventListener("click", boot);
    NS.$("#logout").addEventListener("click", NS.signOut);
  }

  function say(message, ok) {
    var box = NS.$("#msg");
    if (!box) return;
    box.textContent = message || "";
    box.hidden = !message;
    box.className = "alert " + (ok ? "success" : "error");
  }

  async function boot() {
    var ctx = await NS.context();
    me = ctx.profile;
    if (me && ctx.session && ctx.session.user && !me.email) me.email = ctx.session.user.email;
    if (!ctx.session) {
      me = null;
      render();
      return;
    }
    if (!me) {
      viewMissingProfile();
      return;
    }
    render();
  }

  function viewMissingProfile() {
    NS.mountHeader(null);
    app.innerHTML =
      '<div class="card"><h1>' + NS.esc(t("error")) + "</h1>" +
      '<div class="alert error">' + NS.esc(t("profileMissing")) + "</div>" +
      '<div class="row" style="margin-top:1rem">' +
      '<button class="btn danger" id="logoutMissing" type="button">' + NS.esc(t("signOut")) + "</button>" +
      "</div></div>";
    NS.$("#logoutMissing").addEventListener("click", NS.signOut);
  }

  if (!sb) {
    app.innerHTML = '<div class="alert error">Supabase failed to load. Check your connection.</div>';
    return;
  }

  sb.auth.onAuthStateChange(function (event) {
    if (event === "PASSWORD_RECOVERY") {
      recovery = true;
      boot();
    } else if (event === "SIGNED_OUT") {
      me = null;
      render();
    }
  });

  NS.onLang(function () {
    if (recovery) viewRecovery();
    else if (!me) viewAuth();
    else render();
  });

  var hash = location.hash || "";
  if (hash.indexOf("type=recovery") !== -1) recovery = true;

  boot();
})();
</script>
</body>
</html>
