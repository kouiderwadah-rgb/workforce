<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Space</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#14202b;--bg:#f6f8fa;--navy:#0b1b2b;--em:#0f6b4f;--acc:#10b981;--gold:#d4a017;--card:#fff;--line:#d9e1e8;--mute:#5d6d7b;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef3;--bg:#0a1410;--card:#12211a;--line:#25392f;--mute:#9db0a5}}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.2rem}
header b{margin-inline-end:auto;font-size:1.1rem;border-bottom:2px solid var(--gold)}header span{color:#9cb;font-size:.9rem}
.lk{background:none;border:0;color:#cfe;font:inherit;cursor:pointer;padding:.3rem .6rem}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1.1rem 4rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem;max-width:440px;margin:2rem auto}
.wide{max-width:none;margin:1rem 0}
h1,h2{margin:.2rem 0 .8rem}label{display:block;margin:.6rem 0 .2rem;font-weight:500}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--em);color:#fff;border:0;border-radius:8px;padding:.55rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;margin-top:.9rem}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500;margin:0;padding:.3rem .7rem}.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad);margin:0;padding:.3rem .7rem}
.btn[disabled]{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:.4rem;margin-bottom:.6rem}.tabs button{flex:1;background:none;border:1px solid var(--line);border-radius:8px;padding:.45rem;font:inherit;color:var(--ink);cursor:pointer}.tabs [aria-selected=true]{background:var(--em);color:#fff;border-color:var(--em)}
.msg{margin-top:.8rem;padding:.5rem .7rem;border-radius:8px;background:rgba(212,160,23,.14);border:1px solid var(--gold)}.msg:empty{display:none}
table{width:100%;border-collapse:collapse}th,td{padding:.6rem;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500}
.wrap{overflow-x:auto}.badge{padding:.1rem .6rem;border:1px solid currentColor;border-radius:99px;font-size:.82rem}
.pending{color:#b45309}.active{color:#0f7a56}.suspended,.rejected{color:var(--bad)}.note{color:var(--mute);font-size:.92rem}.row{display:flex;gap:.4rem;flex-wrap:wrap}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:1rem 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem}
</style>
</head>
<body>
<header><b><a href="index.html" style="color:inherit;text-decoration:none">New Space</a></b><span id="who"></span><button class="lk" id="lang"></button><button class="lk" id="out" hidden></button></header>
<main id="app"></main>
<script>
const SB_URL="https://ehhtcklnbwxjdlvjylqr.supabase.co",SB_KEY="sb_publishable_5hnwRyn13Q-2BOrllpDv0w_oQbgIXxU";
const sb=supabase.createClient(SB_URL,SB_KEY);
const T={ar:{login:"تسجيل الدخول",reg:"حساب جديد",email:"البريد الإلكتروني",pass:"كلمة المرور",name:"الاسم الكامل",phone:"رقم الجوال",forgot:"نسيت كلمة المرور؟",go:"دخول",create:"إنشاء الحساب",out:"خروج",lang:"English",
checkMail:"تم إنشاء الحساب. إن طُلب منك تأكيد البريد فافتح الرسالة ثم سجّل الدخول.",resetSent:"أُرسل رابط استعادة كلمة المرور إلى بريدك.",needEmail:"اكتب بريدك أولاً.",newPass:"كلمة المرور الجديدة",save:"حفظ",passShort:"كلمة المرور 8 أحرف على الأقل.",
pending:"طلبك قيد المراجعة",pendingP:"سيراجع المدير طلبك. ستظهر لك لوحتك بعد الموافقة.",rejected:"تم رفض الطلب",suspended:"الحساب موقوف",reason:"السبب",
appForm:"أكمل طلب التوظيف",position:"الوظيفة المطلوبة",nat:"الجنسية",notes:"ملاحظات",submit:"إرسال الطلب",sent:"تم إرسال الطلب.",
staffHome:"لوحة الموظف",staffP:"حسابك مفعّل. سيظهر هنا جدول عملك والتسجيل بالحضور في المرحلة التالية.",
mgr:"إدارة الموظفين",owner:"لوحة المالك",colName:"الاسم",colPos:"الوظيفة",colSt:"الحالة",colRole:"الدور",appr:"موافقة",rej:"رفض",susp:"إيقاف",act:"تفعيل",rejWhy:"سبب الرفض؟",
st:{pending:"بانتظار الموافقة",active:"نشط",suspended:"موقوف",rejected:"مرفوض"},rl:{staff:"موظف",admin:"مدير",owner:"مالك"},
docs:"المستندات والفواتير (تجريبي)",docPass:"صورة جواز السفر",docRes:"الإقامة (QID)",docPhoto:"صورة شخصية",big:"الملف أكبر من 5 ميغابايت.",docsSent:"المستندات المرفوعة",colDocs:"المستندات",view:"عرض",dt:{passport:"جواز السفر",residence:"الإقامة",photo:"صورة شخصية"},err:"حدث خطأ: ",empty:"لا يوجد موظفون بعد.",roleNote:"تغيير الأدوار للمالك فقط."},
en:{login:"Sign in",reg:"New account",email:"Email",pass:"Password",name:"Full name",phone:"Mobile number",forgot:"Forgot password?",go:"Sign in",create:"Create account",out:"Sign out",lang:"العربية",
checkMail:"Account created. If email confirmation is required, open the message, then sign in.",resetSent:"A password reset link was sent to your email.",needEmail:"Enter your email first.",newPass:"New password",save:"Save",passShort:"Password must be at least 8 characters.",
pending:"Your application is under review",pendingP:"An administrator will review it. Your dashboard appears once approved.",rejected:"Application rejected",suspended:"Account suspended",reason:"Reason",
appForm:"Complete your application",position:"Position applied for",nat:"Nationality",notes:"Notes",submit:"Submit application",sent:"Application sent.",
staffHome:"Staff dashboard",staffP:"Your account is active. Your schedule and attendance check-in arrive in the next phase.",
mgr:"Staff management",owner:"Owner dashboard",colName:"Name",colPos:"Position",colSt:"Status",colRole:"Role",appr:"Approve",rej:"Reject",susp:"Suspend",act:"Activate",rejWhy:"Reason for rejection?",
st:{pending:"Pending",active:"Active",suspended:"Suspended",rejected:"Rejected"},rl:{staff:"Staff",admin:"Admin",owner:"Owner"},
docs:"Documents and invoices (demo)",docPass:"Passport copy",docRes:"Residence permit (QID)",docPhoto:"Personal photo",big:"File is larger than 5 MB.",docsSent:"Uploaded documents",colDocs:"Documents",view:"View",dt:{passport:"Passport",residence:"Residence permit",photo:"Personal photo"},err:"Error: ",empty:"No staff yet.",roleNote:"Only the owner can change roles."}};
let L=localStorage.getItem("lang")||"ar",me=null,mode="login",recovery=false;
const t=k=>T[L][k],$=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=m=>{const e=$("#msg");if(e)e.textContent=m};
async function boot(){
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";$("#lang").textContent=t("lang");$("#out").textContent=t("out");
 const {data:{session}}=await sb.auth.getSession();
 $("#out").hidden=!session;
 if(recovery)return viewReset();
 if(!session){me=null;$("#who").textContent="";return viewAuth()}
 const {data,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
 if(error||!data){app.innerHTML=`<div class="box"><p>${t("err")}${esc(error?.message)}</p></div>`;return}
 me=data;$("#who").textContent=`${me.full_name||session.user.email} · ${t("rl")[me.role]}`;
 if(me.status!="active")return viewStatus();
 if(me.role=="staff")return viewStaff();
 return viewManager();
}
function viewAuth(){
 const reg=mode=="reg";
 app.innerHTML=`<div class="box"><div class="tabs" role="tablist"><button role="tab" aria-selected="${!reg}" data-m="login">${t("login")}</button><button role="tab" aria-selected="${reg}" data-m="reg">${t("reg")}</button></div>
 <form id="f">${reg?`<label for="n">${t("name")}</label><input id="n" required autocomplete="name"><label for="p">${t("phone")}</label><input id="p" type="tel" required autocomplete="tel">`:""}
 <label for="e">${t("email")}</label><input id="e" type="email" required autocomplete="email">
 <label for="w">${t("pass")}</label><input id="w" type="password" required minlength="8" autocomplete="${reg?"new":"current"}-password">
 <button class="btn" id="go">${reg?t("create"):t("go")}</button></form>
 ${reg?"":`<p><button class="lk" id="fg" style="color:var(--em)">${t("forgot")}</button></p>`}<div class="msg" id="msg" role="status"></div></div>`;
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;viewAuth()});
 $("#fg")&&($("#fg").onclick=async()=>{const e=$("#e").value;if(!e)return say(t("needEmail"));
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin});say(error?t("err")+error.message:t("resetSent"))});
 $("#f").onsubmit=async ev=>{ev.preventDefault();$("#go").disabled=true;const e=$("#e").value.trim(),w=$("#w").value;let r;
  if(reg)r=await sb.auth.signUp({email:e,password:w,options:{data:{full_name:$("#n").value.trim(),phone:$("#p").value.trim()}}});
  else r=await sb.auth.signInWithPassword({email:e,password:w});
  $("#go").disabled=false;
  if(r.error)return say(t("err")+r.error.message);
  if(reg&&!r.data.session){mode="login";viewAuth();return say(t("checkMail"))}
  boot()};
}
function viewReset(){
 app.innerHTML=`<div class="box"><h2>${t("newPass")}</h2><form id="f"><input id="w" type="password" minlength="8" required autocomplete="new-password" aria-label="${t("newPass")}"><button class="btn">${t("save")}</button></form><div class="msg" id="msg"></div></div>`;
 $("#f").onsubmit=async ev=>{ev.preventDefault();const w=$("#w").value;if(w.length<8)return say(t("passShort"));
  const {error}=await sb.auth.updateUser({password:w});if(error)return say(t("err")+error.message);recovery=false;history.replaceState(null,"",location.pathname);boot()};
}
async function viewStatus(){
 const s=me.status,{data:ap}=await sb.from("staff_applications").select("*").eq("profile_id",me.id).maybeSingle();
 let h=`<div class="box"><h2>${s=="pending"?t("pending"):s=="rejected"?t("rejected"):t("suspended")}</h2>`;
 if(s=="pending")h+=`<p class="note">${t("pendingP")}</p>`;
 if(me.rejection_reason)h+=`<p><b>${t("reason")}:</b> ${esc(me.rejection_reason)}</p>`;
 if(s=="pending"&&!ap)h+=`<h2 style="margin-top:1rem">${t("appForm")}</h2><form id="f"><label for="a">${t("position")}</label><input id="a" required><label for="b">${t("nat")}</label><input id="b" required><label for="c">${t("notes")}</label><textarea id="c" rows="3"></textarea><label for="d1">${t("docPass")}</label><input id="d1" type="file" accept="image/*,application/pdf" required><label for="d2">${t("docRes")}</label><input id="d2" type="file" accept="image/*,application/pdf" required><label for="d3">${t("docPhoto")}</label><input id="d3" type="file" accept="image/*" required><button class="btn">${t("submit")}</button></form>`;
 if(ap&&(ap.documents||[]).length)h+=`<p class="note">${t("docsSent")}: ${ap.documents.length}</p>`;
 app.innerHTML=h+`<div class="msg" id="msg"></div></div>`;
 $("#f")&&($("#f").onsubmit=async ev=>{ev.preventDefault();
  const btn=ev.target.querySelector("button");btn.disabled=true;const docs=[];
  for(const [k,id] of [["passport","d1"],["residence","d2"],["photo","d3"]]){const f=$("#"+id).files[0];if(!f)continue;
   if(f.size>5e6){btn.disabled=false;return say(t("big"))}
   const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");const path=`${me.id}/${k}-${Date.now()}.${ext}`;
   const up=await sb.storage.from("documents").upload(path,f,{contentType:f.type});if(up.error){btn.disabled=false;return say(t("err")+up.error.message)}
   docs.push({type:k,path})}
  const {error}=await sb.from("staff_applications").insert({profile_id:me.id,position:$("#a").value.trim(),nationality:$("#b").value.trim(),notes:$("#c").value.trim(),documents:docs});
  if(error){btn.disabled=false;return say(t("err")+error.message)}viewStatus();})
}
function viewStaff(){app.innerHTML=`<div class="box wide"><h1>${t("staffHome")}</h1><p>${t("staffP")}</p></div>`}
async function viewManager(){
 const owner=me.role=="owner";
 const {data,error}=await sb.from("profiles").select("*,staff_applications!profile_id(position,nationality,documents)").order("created_at",{ascending:false});
 if(error)return app.innerHTML=`<div class="box"><p>${t("err")}${esc(error.message)}</p></div>`;
 const rows=data.filter(p=>p.id!=me.id).map(p=>{const a=[].concat(p.staff_applications||[])[0]||{};
  const acts=p.status=="pending"?`<button class="btn alt" data-a="active" data-id="${p.id}">${t("appr")}</button> <button class="btn bad" data-a="rejected" data-id="${p.id}">${t("rej")}</button>`:
   p.status=="active"?`<button class="btn bad" data-a="suspended" data-id="${p.id}">${t("susp")}</button>`:`<button class="btn alt" data-a="active" data-id="${p.id}">${t("act")}</button>`;
  const role=owner?`<select data-r="${p.id}" aria-label="${t("colRole")}">${["staff","admin","owner"].map(r=>`<option value="${r}" ${r==p.role?"selected":""}>${t("rl")[r]}</option>`).join("")}</select>`:esc(t("rl")[p.role]);
  return `<tr><td>${esc(p.full_name)}<br><span class="note">${esc(p.phone)}</span></td><td>${esc(a.position||"—")}<br><span class="note">${esc(a.nationality||"")}</span></td><td>${(a.documents||[]).length?`<button class="btn alt" data-d="${p.id}">${t("view")} (${a.documents.length})</button>`:"—"}</td><td><span class="badge ${p.status}">${t("st")[p.status]}</span></td><td>${role}</td><td><div class="row">${acts}</div></td></tr>`}).join("");
 const c=s=>data.filter(p=>p.status==s&&p.id!=me.id).length;
 app.innerHTML=`<h1>${owner?t("owner"):t("mgr")}</h1><div class="grid"><div class="card"><b>${c("pending")}</b><br>${t("st").pending}</div><div class="card"><b>${c("active")}</b><br>${t("st").active}</div><div class="card"><b>${c("suspended")+c("rejected")}</b><br>${t("st").suspended} / ${t("st").rejected}</div></div>
 <div class="card wrap"><table><thead><tr><th>${t("colName")}</th><th>${t("colPos")}</th><th>${t("colDocs")}</th><th>${t("colSt")}</th><th>${t("colRole")}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="6">${t("empty")}</td></tr>`}</tbody></table></div>
 ${owner?"":`<p class="note">${t("roleNote")}</p>`}<p><a href="documents.html" style="color:var(--em)">${t("docs")}</a></p><div class="msg" id="msg"></div>`;
 const showDocs=async id=>{const p=data.find(x=>x.id==id),a=[].concat(p.staff_applications||[])[0]||{},out=[];
  for(const d of a.documents||[]){const {data:u}=await sb.storage.from("documents").createSignedUrl(d.path,300);
   if(u?.signedUrl)out.push(`<li><a href="${u.signedUrl}" target="_blank" rel="noopener">${esc(t("dt")[d.type]||d.type)}</a></li>`)}
  $("#msg").innerHTML=`<b>${esc(p.full_name)}</b><ul>${out.join("")||"—"}</ul>`};
 app.onclick=async e=>{const d=e.target.closest("[data-d]");if(d)return showDocs(d.dataset.d);const b=e.target.closest("[data-a]");if(!b)return;let patch={status:b.dataset.a};
  if(patch.status=="rejected"){const r=prompt(t("rejWhy"));if(r===null)return;patch.rejection_reason=r||null}else patch.rejection_reason=null;
  const {error}=await sb.from("profiles").update(patch).eq("id",b.dataset.id);error?say(t("err")+error.message):viewManager()};
 app.onchange=async e=>{const id=e.target.dataset.r;if(!id)return;
  const {error}=await sb.from("profiles").update({role:e.target.value}).eq("id",id);error?say(t("err")+error.message):viewManager()};
}
$("#lang").onclick=()=>{L=L=="ar"?"en":"ar";localStorage.setItem("lang",L);boot()};
$("#out").onclick=async()=>{await sb.auth.signOut();boot()};
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){recovery=true;boot()}});
boot();
</script>
</body>
</html>
