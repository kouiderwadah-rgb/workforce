  var CATEGORIES = ["client", "supplier", "salaries", "transport", "fuel", "rent", "utilities", "supplies", "maintenance", "accommodation", "food", "uniforms", "equipment", "other"];
  var FIN_STATUSES = ["pending", "approved", "rejected", "paid"];

  function catLabel(key) {
    return (NS.t("categoryLabels") || {})[key] || key || "—";
  }

  function badge(status) {
    return '<span class="badge ' + NS.esc(status) + '">' + NS.esc(NS.statusLabel(status)) + "</span>";
  }

  function isApproved(profile) {
    return profile && NS.APPROVED.includes(profile.status);
  }

  function docsFor(profileId) {
    return docs.filter(function (d) { return d.profile_id === profileId; });
  }

  function pendingCount() {
    var p = profiles.filter(function (x) { return x.status === "pending"; }).length;
    var d = docs.filter(function (x) { return x.status === "pending"; }).length;
    return p + d;
  }

  function drawTabs() {
    var tabs = [
      ["approvals", t("tabsApprovals") + (pendingCount() ? " (" + NS.fmtNum(pendingCount()) + ")" : "")],
      ["team", t("tabsTeam")],
      ["finance", t("tabsFinance")],
    ];
    NS.$("#tabs").innerHTML = tabs
      .map(function (x) {
        return '<button class="tab" role="tab" type="button" aria-selected="' + (tab === x[0]) +
          '" data-tab="' + x[0] + '">' + NS.esc(x[1]) + "</button>";
      })
      .join("");
  }

  function draw() {
    NS.$("#pageTitle").textContent = t("adminTitle");
    NS.$("#pageNote").textContent = me.full_name || "";
    drawTabs();
    var host = NS.$("#view");
    if (host) {
      host.onclick = null;
      host.onchange = null;
    }
    if (tab === "approvals") drawApprovals();
    else if (tab === "team") drawTeam();
    else drawFinance();
  }

  /* Approvals ------------------------------------------------------------- */
  function drawApprovals() {
    var pending = profiles.filter(function (p) { return p.status === "pending"; });
    var docPending = docs.filter(function (d) { return d.status === "pending"; });
    var view = NS.$("#view");

    var profileCards = pending
      .map(function (p) {
        var count = docsFor(p.id).length;
        return '<article class="card flat">' +
          '<div class="row" style="margin-bottom:.4rem">' + NS.avatarHtml(p.full_name, photos[p.id]) +
          "<div><b>" + NS.esc(p.full_name || "—") + "</b><br>" +
          '<span class="note">' + NS.esc(p.phone || "") + "</span></div></div>" +
          '<div class="note">' + NS.esc(t("position")) + ": " + NS.esc(p.position || "—") +
          " · " + NS.esc(t("nationality")) + ": " + NS.esc(p.nationality || "—") + "</div>" +
          '<div class="note">' + NS.esc(t("docsPending")) + ": " + NS.fmtNum(count) + "</div>" +
          '<div class="row" style="margin-top:.7rem">' +
          '<button class="btn sm" data-review="' + NS.esc(p.id) + '" type="button">' + NS.esc(t("review")) + "</button>" +
          "</div></article>";
      })
      .join("");

    var docRows = docPending
      .map(function (d) {
        var p = profiles.find(function (x) { return x.id === d.profile_id; }) || {};
        return '<tr><td><div class="row">' + NS.avatarHtml(p.full_name, photos[p.id]) +
          "<span>" + NS.esc(p.full_name || d.profile_id) + "</span></div></td>" +
          "<td>" + NS.esc((NS.t("dt") || {})[d.doc_type] || d.doc_type) + "</td>" +
          "<td>" + NS.esc(NS.fmtDate(d.created_at)) + "</td>" +
          '<td><button class="btn ghost sm" data-review="' + NS.esc(d.profile_id) + '" type="button">' + NS.esc(t("review")) + "</button></td></tr>";
      })
      .join("");

    view.innerHTML =
      "<h2>" + NS.esc(t("pendingApprovals")) + "</h2>" +
      (pending.length
        ? '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">' + profileCards + "</div>"
        : '<div class="empty"><b>' + NS.esc(t("noPending")) + "</b><br><span class=\"note\">" +
          NS.esc(t("noPendingHint")) + "</span></div>") +
      (docPending.length
        ? '<div class="card" style="margin-top:1rem"><h3>' + NS.esc(t("docsPending")) + "</h3>" +
          '<div class="table-wrap"><table><tbody>' + docRows + "</tbody></table></div></div>"
        : "");

    view.onclick = function (e) {
      var b = e.target.closest("[data-review]");
      if (b) openReview(b.dataset.review);
    };
  }

  function openReview(profileId) {
    var p = profiles.find(function (x) { return x.id === profileId; });
    if (!p) return;
    var ds = docsFor(profileId);

    var docHtml = ds.length
      ? ds
          .map(function (d) {
            var label = (NS.t("dt") || {})[d.doc_type] || d.doc_type;
            return '<div class="card flat" style="margin-bottom:.6rem">' +
              '<div class="between"><b>' + NS.esc(label) +
              (d.side ? " · " + NS.esc(d.side) : "") + "</b>" + badge(d.status) + "</div>" +
              '<div class="row" style="margin-top:.5rem">' +
              '<button class="btn ghost sm" data-doc-view="' + NS.esc(d.id) + '" type="button">' + NS.esc(t("open")) + "</button>" +
              (d.status !== "approved"
                ? '<button class="btn sm" data-doc-ok="' + NS.esc(d.id) + '" type="button">' + NS.esc(t("approve")) + "</button>"
                : "") +
              (d.status !== "rejected"
                ? '<button class="btn danger sm" data-doc-no="' + NS.esc(d.id) + '" type="button">' + NS.esc(t("reject")) + "</button>"
                : "") +
              "</div>" +
              (d.review_note ? '<p class="note">' + NS.esc(d.review_note) + "</p>" : "") +
              "</div>";
          })
          .join("")
      : '<p class="note">' + NS.esc(t("noDocuments")) + "</p>";

    var inner =
      '<div class="modal-head"><h2>' + NS.esc(t("reviewTitle")) + "</h2>" +
      '<button class="btn ghost sm" data-close type="button">' + NS.esc(t("close")) + "</button></div>" +
      '<div class="row" style="margin-bottom:.6rem">' + NS.avatarHtml(p.full_name, photos[p.id]) +
      "<div><b>" + NS.esc(p.full_name || "—") + "</b><br>" +
      '<span class="note">' + NS.esc(p.phone || "") + " · " + NS.esc(p.nationality || "") + "</span></div></div>" +
      '<div class="note" style="margin-bottom:.8rem">' + NS.esc(t("position")) + ": " + NS.esc(p.position || "—") +
      " · " + NS.esc(t("submitted")) + ": " + NS.esc(NS.fmtDate(p.created_at)) + "</div>" +
      "<h3>" + NS.esc(t("documentsCount")) + "</h3>" + docHtml +
      '<div class="divider"></div>' +
      (p.status === "pending"
        ? '<div class="row"><button class="btn" data-p-ok="' + NS.esc(p.id) + '" type="button">' + NS.esc(t("approveAccount")) +
          '</button><button class="btn danger" data-p-no="' + NS.esc(p.id) + '" type="button">' + NS.esc(t("rejectAccount")) + "</button></div>"
        : '<p class="note">' + NS.esc(NS.statusLabel(p.status)) + "</p>");

    var overlay = NS.openModal(inner, { wide: true });
    overlay.addEventListener("click", async function (e) {
      if (e.target.closest("[data-close]")) return NS.closeModal();
      var v = e.target.closest("[data-doc-view]");
      if (v) return viewDocument(v.dataset.docView);
      var dok = e.target.closest("[data-doc-ok]");
      if (dok) return setDocStatus(dok.dataset.docOk, "approved", null, overlay);
      var dno = e.target.closest("[data-doc-no]");
      if (dno) {
        var reason = window.prompt(t("confirmDocReject"), "");
        if (reason === null) return;
        return setDocStatus(dno.dataset.docNo, "rejected", reason, overlay);
      }
      var pok = e.target.closest("[data-p-ok]");
      if (pok) return setProfileStatus(pok.dataset.pOk, "approved", null, overlay);
      var pno = e.target.closest("[data-p-no]");
      if (pno) {
        var why = window.prompt(t("confirmProfileReject"), "");
        if (why === null) return;
        if (!why.trim()) return NS.toast(t("rejectReasonRequired"), "error");
        return setProfileStatus(pno.dataset.pNo, "rejected", why.trim(), overlay);
      }
    });
  }

  async function viewDocument(id) {
    var d = docs.find(function (x) { return x.id === id; });
    if (!d) return;
    var url = await NS.signedUrl("documents", d.file_path, 60);
    if (!url) return NS.toast(t("noDocuments"), "error");
    var inner = '<div class="modal-head"><h2>' + NS.esc((NS.t("dt") || {})[d.doc_type] || d.doc_type) + "</h2>" +
      '<button class="btn ghost sm" data-close type="button">' + NS.esc(t("close")) + "</button></div>";
    if (d.mime_type && d.mime_type.indexOf("image/") === 0) {
      inner += '<img class="doc-frame" src="' + NS.esc(url) + '" alt="">';
    } else {
      inner += '<object class="doc-frame" data="' + NS.esc(url) + '" type="application/pdf"></object>' +
        '<p class="note"><a href="' + NS.esc(url) + '" target="_blank" rel="noopener">' + NS.esc(t("open")) + "</a></p>";
    }
    var overlay = NS.openModal(inner, { wide: true });
    overlay.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) NS.closeModal();
    });
  }

  async function setDocStatus(id, status, note, overlay) {
    var res = await sb.from("staff_documents").update({
      status: status,
      review_note: note || null,
      reviewed_by: me.id,
      reviewed_at: new Date().toISOString(),
    }).eq("id", id);
    if (res.error) return NS.toast(res.error.message, "error");
    var d = docs.find(function (x) { return x.id === id; });
    if (d) {
      d.status = status;
      d.review_note = note || null;
    }
    NS.toast(t("docUpdated"));
    NS.closeModal();
    draw();
  }

  async function setProfileStatus(id, status, reason, overlay) {
    if (status === "approved" && !window.confirm(t("confirmApprove"))) return;
    var res = await sb.from("profiles").update({
      status: status,
      rejection_reason: status === "rejected" ? reason : null,
    }).eq("id", id);
    if (res.error) return NS.toast(res.error.message, "error");
    var p = profiles.find(function (x) { return x.id === id; });
    if (p) {
      p.status = status;
      p.rejection_reason = status === "rejected" ? reason : null;
    }
    NS.closeModal();
    NS.toast(status === "approved" ? t("accountApproved") : t("accountRejected"));
    draw();
  }

  /* Team ------------------------------------------------------------------ */
  function filteredTeam() {
    return profiles.filter(function (p) {
      if (p.id === me.id) return false;
      if (teamFilter === "all") {
        if (!p.status) return false;
      } else if (teamFilter === "approved") {
        if (!isApproved(p)) return false;
      } else if (p.status !== teamFilter) {
        return false;
      }
      if (teamQuery) {
        var hay = ((p.full_name || "") + " " + (p.phone || "")).toLowerCase();
        if (hay.indexOf(teamQuery.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function drawTeam() {
    var list = filteredTeam();
    var filters = [
      ["all", t("filterAll")],
      ["approved", t("filterApproved")],
      ["pending", t("filterPending")],
      ["rejected", t("filterRejected")],
      ["suspended", t("filterSuspended")],
    ];
    var pillHtml = filters
      .map(function (f) {
        return '<button class="pill" type="button" data-filter="' + f[0] + '" aria-pressed="' + (teamFilter === f[0]) + '">' +
          NS.esc(f[1]) + "</button>";
      })
      .join("");

    var cards = list
      .map(function (p) {
        var checked = selected.has(p.id) ? " checked" : "";
        return '<article class="card flat" data-card="' + NS.esc(p.id) + '">' +
          '<div style="display:flex;justify-content:center;margin-bottom:.6rem">' +
          NS.avatarHtml(p.full_name, photos[p.id], "lg") + "</div>" +

        : '<div class="empty">' + NS.esc(t("noTeam")) + "</div>");

        again.focus();
        again.setSelectionRange(again.value.length, again.value.length);

    }, 300));

    NS.$("#view").onclick = function (e) {

        teamFilter = pill.dataset.filter;
        drawTeam();

      var cb = e.target.closest("[data-select]");
      if (cb) {
        if (cb.checked) selected.add(cb.dataset.select);

  async function assignSelected() {
    var jobId = NS.$("#jobPick") ? NS.$("#jobPick").value : "";
    if (!selected.size) return NS.toast(t("selectStaffFirst"), "error");
    if (!jobId) return NS.toast(t("selectJob"), "error");
    var btn = NS.$("#assignBtn");

    var rows = Array.from(selected).map(function (id) {
      return { assignment_id: jobId, staff_id: id };
    });
    var res = await sb.from("assignment_staff").upsert(rows, {
      onConflict: "assignment_id,staff_id",

    drawTeam();

  /* Finance --------------------------------------------------------------- */
  function financeRows() {
    var rows = finKind === "invoices" ? invoices : expenses;
    return rows.filter(function (r) {
      var date = finKind === "invoices" ? r.issue_date : r.expense_date;
      if (finFilter.from && (!date || date < finFilter.from)) return false;
      if (finFilter.to && (!date || date > finFilter.to)) return false;
      if (finFilter.category && (r.category || "") !== finFilter.category) return false;
      if (finFilter.status && (r.status || "") !== finFilter.status) return false;
      if (finFilter.q) {
        var hay = ((r.vendor || "") + " " + (r.invoice_number || "") + " " + (r.description || "")).toLowerCase();
        if (hay.indexOf(finFilter.q.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  function totalsFor(rows) {
    var total = 0;
    var tax = 0;
    rows.forEach(function (r) {
      if (finKind === "invoices") {
        total += Number(r.total) || 0;
        tax += Number(r.tax_amount) || 0;
      } else {
        total += Number(r.amount) || 0;
      }
    });
    return { total: total, tax: tax };
  }

  function drawFinance() {
    var rows = financeRows();
    var totals = totalsFor(rows);
    var catOptions = '<option value="">' + NS.esc(t("allCategories")) + "</option>" +

      }).join("");
    var statusOptions = '<option value="">' + NS.esc(t("allStatuses")) + "</option>" +
      FIN_STATUSES.map(function (s) {
        return '<option value="' + s + '"' + (finFilter.status === s ? " selected" : "") + ">" +

            "</td><td>" + badge(r.status) + "</td>"
          : "<td>" + NS.esc(NS.fmtDate(r.expense_date)) + "</td><td>" + NS.esc(r.vendor || "—") + "</td><td>" + NS.esc(r.description || "—") +

        var receiptBtn = r.file_path

          '</button><button class="btn danger sm" data-del="' + NS.esc(r.id) + '" type="button">' + NS.esc(t("remove")) + "</button></div></td></tr>";

      .join("");

    NS.$("#view").innerHTML =
      "<h2>" + NS.esc(t("finance")) + "</h2>" +
      '<div class="tabs" role="tablist" style="border:0;margin-bottom:.6rem">' +
      '<button class="tab" role="tab" type="button" data-fin="invoices" aria-selected="' + (finKind === "invoices") + '">' + NS.esc(t("invoicesTab")) + "</button>" +
      '<button class="tab" role="tab" type="button" data-fin="expenses" aria-selected="' + (finKind === "expenses") + '">' + NS.esc(t("expensesTab")) + "</button>" +
      "</div>" +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:1rem">' +
      '<div class="kpi"><b>' + NS.fmtNum(rows.length) + "</b><span>" + NS.esc(t("count")) + "</span></div>" +
      '<div class="kpi"><b>' + NS.esc(NS.fmtMoney(totals.total)) + "</b><span>" + NS.esc(finKind === "invoices" ? t("totalInvoices") : t("totalExpenses")) + "</span></div>" +
      (finKind === "invoices"
        ? '<div class="kpi"><b>' + NS.esc(NS.fmtMoney(totals.tax)) + "</b><span>" + NS.esc(t("totalTax")) + "</span></div>" +
          '<div class="kpi"><b>' + NS.esc(NS.fmtMoney(totals.total - totals.tax)) + "</b><span>" + NS.esc(t("net")) + "</span></div>"
        : "") +
      "</div>" +
      '<div class="card" style="margin-bottom:1rem"><div class="form-grid">' +
      '<div class="field"><label>' + NS.esc(t("from")) + '</label><input id="fFrom" type="date" value="' + NS.esc(finFilter.from) + '"></div>' +
      '<div class="field"><label>' + NS.esc(t("to")) + '</label><input id="fTo" type="date" value="' + NS.esc(finFilter.to) + '"></div>' +
      '<div class="field"><label>' + NS.esc(t("category")) + '</label><select id="fCat">' + catOptions + "</select></div>" +

      '<div class="field"><label>' + NS.esc(t("search")) + '</label><input id="fQ" type="search" value="' + NS.esc(finFilter.q) + '" placeholder="' + NS.esc(t("searchFinance")) + '"></div>' +
      "</div>" +
      '<div class="row" style="margin-top:.6rem">' +
      '<button class="btn" id="addFin" type="button">' + NS.esc(finKind === "invoices" ? t("addInvoice") : t("addExpense")) + "</button>" +
      '<button class="btn ghost" id="exportCsv" type="button">' + NS.esc(t("exportCsv")) + "</button>" +
      "</div></div>" +
      '<div class="table-wrap"><table><thead>' + head + "</thead><tbody>" +
      (body || '<tr><td colspan="7"><div class="empty">' + NS.esc(finKind === "invoices" ? t("noInvoices") : t("noExpenses")) + "</div></td></tr>") +
      "</tbody></table></div>";

    NS.$("#view").onclick = function (e) {
      var f = e.target.closest("[data-fin]");
      if (f) {
        finKind = f.dataset.fin;
        selected.clear();
        drawFinance();
        return;
      }
      var add = e.target.closest("#addFin");
      if (add) return openFinanceForm(null);
      var edit = e.target.closest("[data-edit]");
      if (edit) return openFinanceForm(edit.dataset.edit);
      var del = e.target.closest("[data-del]");
      if (del) return removeFinance(del.dataset.del);
      var rec = e.target.closest("[data-receipt]");
      if (rec) return openReceipt(rec.dataset.receipt);
      var exp = e.target.closest("#exportCsv");
      if (exp) return exportFinance(rows);
    };

    ["fFrom", "fTo", "fCat", "fStatus"].forEach(function (id) {
      var el = NS.$("#" + id);
      if (el) el.addEventListener("change", function () {
        finFilter.from = NS.$("#fFrom").value;
        finFilter.to = NS.$("#fTo").value;
        finFilter.category = NS.$("#fCat").value;
        finFilter.status = NS.$("#fStatus").value;
        drawFinance();
      });
    });
    var q = NS.$("#fQ");
    if (q) q.addEventListener("input", NS.debounce(function () {
      finFilter.q = q.value;
      drawFinance();
    }, 300));
  }

    var fields = isInv
      ? '<div class="form-grid">' +
        '<div class="field"><label for="fiNum">' + NS.esc(t("invoiceNumber")) + '</label><input id="fiNum" maxlength="80" value="' + NS.esc(v.invoice_number || "") + '"></div>' +
        '<div class="field"><label for="fiVendor">' + NS.esc(t("vendor")) + '</label><input id="fiVendor" maxlength="120" value="' + NS.esc(v.vendor || "") + '"></div>' +
        '<div class="field"><label for="fiIssue">' + NS.esc(t("issueDate")) + '</label><input id="fiIssue" type="date" value="' + NS.esc(v.issue_date || NS.today()) + '"></div>' +
        '<div class="field"><label for="fiDue">' + NS.esc(t("dueDate")) + '</label><input id="fiDue" type="date" value="' + NS.esc(v.due_date || "") + '"></div>' +
        '<div class="field"><label for="fiSub">' + NS.esc(t("subtotal")) + '</label><input id="fiSub" type="number" min="0" step="0.01" value="' + NS.esc(v.subtotal != null ? v.subtotal : "") + '"></div>' +
        '<div class="field"><label for="fiTax">' + NS.esc(t("tax")) + '</label><input id="fiTax" type="number" min="0" step="0.01" value="' + NS.esc(v.tax_amount != null ? v.tax_amount : 0) + '"></div>' +
        '<div class="field"><label for="fiTotal">' + NS.esc(t("total")) + '</label><input id="fiTotal" type="number" min="0" step="0.01" required value="' + NS.esc(v.total != null ? v.total : "") + '"></div>' +
        '<div class="field"><label for="fiCur">' + NS.esc(t("currency")) + '</label><input id="fiCur" maxlength="3" value="' + NS.esc(v.currency || "QAR") + '"></div>' +
        '<div class="field"><label for="fiCat">' + NS.esc(t("category")) + '</label><select id="fiCat">' + catOptions + "</select></div>" +
        '<div class="field"><label for="fiStatus">' + NS.esc(t("statusFilter")) + '</label><select id="fiStatus">' + statusOptions + "</select></div>" +
        '<div class="field full"><label for="fiNotes">' + NS.esc(t("notes")) + '</label><textarea id="fiNotes" rows="2">' + NS.esc(v.notes || "") + "</textarea></div>" +
        receiptField +
        "</div>"
      : '<div class="form-grid">' +
        '<div class="field"><label for="feDate">' + NS.esc(t("expenseDate")) + '</label><input id="feDate" type="date" value="' + NS.esc(v.expense_date || NS.today()) + '"></div>' +
        '<div class="field"><label for="feVendor">' + NS.esc(t("vendor")) + '</label><input id="feVendor" maxlength="120" value="' + NS.esc(v.vendor || "") + '"></div>' +
        '<div class="field full"><label for="feDesc">' + NS.esc(t("description")) + '</label><input id="feDesc" maxlength="200" value="' + NS.esc(v.description || "") + '"></div>' +
        '<div class="field"><label for="feCat">' + NS.esc(t("category")) + '</label><select id="feCat">' + catOptions + "</select></div>" +
        '<div class="field"><label for="feAmount">' + NS.esc(t("amount")) + '</label><input id="feAmount" type="number" min="0" step="0.01" required value="' + NS.esc(v.amount != null ? v.amount : "") + '"></div>' +
        '<div class="field"><label for="feCur">' + NS.esc(t("currency")) + '</label><input id="feCur" maxlength="3" value="' + NS.esc(v.currency || "QAR") + '"></div>' +
        '<div class="field"><label for="feStatus">' + NS.esc(t("statusFilter")) + '</label><select id="feStatus">' + statusOptions + "</select></div>" +
        '<div class="field"><label for="feProject">' + NS.esc(t("project")) + '</label><select id="feProject"><option value="">' +
        NS.esc(t("noProject")) + "</option>" + projectOptions + "</select></div>" +
        receiptField +
        "</div>";

    var title = id
      ? (isInv ? t("editInvoice") : t("editExpense"))
      : (isInv ? t("addInvoice") : t("addExpense"));

    var inner =
      '<div class="modal-head"><h2>' + NS.esc(title) + "</h2>" +
      '<button class="btn ghost sm" data-close type="button">' + NS.esc(t("cancel")) + "</button></div>" +
      '<form id="finForm" novalidate>' + fields +
      '<div class="row" style="margin-top:.8rem">' +
      '<button class="btn" id="finSave" type="submit">' + NS.esc(t("save")) + "</button>" +
      '<button class="btn ghost" data-close type="button">' + NS.esc(t("cancel")) + "</button>" +
      "</div></form>";

    var overlay = NS.openModal(inner, { wide: true });
    overlay.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) NS.closeModal();
    });

    NS.$("#finForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      if (saving) return;
      var payload;
      if (isInv) {
        var total = Number(NS.$("#fiTotal").value);
        if (!NS.$("#fiTotal").value || !Number.isFinite(total)) return NS.toast(t("requiredFields"), "error");
        payload = {
          invoice_number: NS.safeText(NS.$("#fiNum").value, 80) || null,
          vendor: NS.safeText(NS.$("#fiVendor").value, 120) || null,
          issue_date: NS.$("#fiIssue").value || null,
          due_date: NS.$("#fiDue").value || null,
          subtotal: NS.$("#fiSub").value ? Number(NS.$("#fiSub").value) : null,
          tax_amount: NS.$("#fiTax").value ? Number(NS.$("#fiTax").value) : 0,
          total: total,
          currency: (NS.$("#fiCur").value || "QAR").toUpperCase().slice(0, 3),
          category: NS.$("#fiCat").value,
          status: NS.$("#fiStatus").value,
          notes: NS.safeText(NS.$("#fiNotes").value, 1000) || null,
        };
      } else {
        var amount = Number(NS.$("#feAmount").value);
        if (!NS.$("#feAmount").value || !Number.isFinite(amount)) return NS.toast(t("expenseAmountBad"), "error");
        payload = {
          expense_date: NS.$("#feDate").value || null,
          vendor: NS.safeText(NS.$("#feVendor").value, 120) || null,
          description: NS.safeText(NS.$("#feDesc").value, 200) || null,
          category: NS.$("#feCat").value,
          amount: amount,
          currency: (NS.$("#feCur").value || "QAR").toUpperCase().slice(0, 3),
          status: NS.$("#feStatus").value,
          project_id: NS.$("#feProject").value || null,
        };
      }

      saving = true;
      var btn = NS.$("#finSave");
      btn.disabled = true;

      var fileInput = NS.$("#finFile");
      var file = fileInput && fileInput.files ? fileInput.files[0] : null;
      var oldPath = id && v.file_path ? v.file_path : null;
      var newPath = null;
      if (file) {
        var ferr = NS.checkFile(file);
        if (ferr === "too_large") {
          saving = false;
          btn.disabled = false;
          return NS.toast(t("receiptTooLarge"), "error");
        }
        if (ferr) {
          saving = false;
          btn.disabled = false;
          return NS.toast(t("receiptBadType"), "error");
        }
        var toSend = file;
        if (file.type.indexOf("image/") === 0) toSend = await NS.compressImage(file, 1600, 0.85);
        if (toSend.size > NS.MAX_BYTES) {
          saving = false;
          btn.disabled = false;
          return NS.toast(t("receiptTooLarge"), "error");
        }
        var dateKey = payload.issue_date || payload.expense_date || NS.today();
        var path = String(dateKey).slice(0, 4) + "/" + NS.uuid() + "." + NS.extOf(toSend.name);
        var up = await NS.upload("receipts", path, toSend);
        if (up.error) {
          saving = false;
          btn.disabled = false;
          return NS.toast(up.error.message, "error");
        }
        newPath = path;
        payload.file_path = path;
      }

      var table = isInv ? "invoices" : "expenses";
      var res;
      if (id) {
        res = await sb.from(table).update(payload).eq("id", id);
      } else {
        payload.created_by = me.id;
        res = await sb.from(table).insert(payload);
      }
      saving = false;
      btn.disabled = false;
      if (res.error) {
        if (newPath) await sb.storage.from("receipts").remove([newPath]);
        return NS.toast(res.error.message, "error");
      }
      if (newPath && oldPath && newPath !== oldPath) {
        await sb.storage.from("receipts").remove([oldPath]);
      }
      NS.closeModal();
      NS.toast(t("saved"));
      await loadFinance();
      draw();
    });
  }

  async function openReceipt(id) {
    var row = (finKind === "invoices" ? invoices : expenses).find(function (r) { return r.id === id; });
    if (!row || !row.file_path) return NS.toast(t("receiptMissing"), "error");
    var url = await NS.signedUrl("receipts", row.file_path, 60);
    if (!url) return NS.toast(t("receiptMissing"), "error");
    var isPdf = /\.pdf$/i.test(row.file_path);
    var inner =
      '<div class="modal-head"><h2>' + NS.esc(t("viewReceipt")) + "</h2>" +
      '<button class="btn ghost sm" data-close type="button">' + NS.esc(t("close")) + "</button></div>";
    if (isPdf) {
      inner += '<object class="doc-frame" data="' + NS.esc(url) + '" type="application/pdf"></object>' +
        '<p class="note"><a href="' + NS.esc(url) + '" target="_blank" rel="noopener">' + NS.esc(t("open")) + "</a></p>";
    } else {
      inner += '<img class="doc-frame" src="' + NS.esc(url) + '" alt="">';
    }
    var overlay = NS.openModal(inner, { wide: true });
    overlay.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) NS.closeModal();
    });
  }

  async function removeFinance(id) {
    if (!window.confirm(t("removeConfirm"))) return;
    var table = finKind === "invoices" ? "invoices" : "expenses";
    var res = await sb.from(table).update({ deleted_at: new Date().toISOString() }).eq("id", id);
    if (res.error) return NS.toast(res.error.message, "error");
    NS.toast(t("deleted"));
    await loadFinance();
    draw();
  }

  function exportFinance(rows) {
    var isInv = finKind === "invoices";
    var header = isInv
      ? ["id", "invoice_number", "vendor", "issue_date", "due_date", "currency", "subtotal", "tax_amount", "total", "category", "status", "notes"]
      : ["id", "expense_date", "vendor", "description", "category", "amount", "currency", "status"];
    var data = rows.map(function (r) {
      return isInv
        ? [r.id, r.invoice_number, r.vendor, r.issue_date, r.due_date, r.currency, r.subtotal, r.tax_amount, r.total, r.category, r.status, r.notes]
        : [r.id, r.expense_date, r.vendor, r.description, r.category, r.amount, r.currency, r.status];
    });
    NS.downloadCsv((isInv ? "invoices-" : "expenses-") + NS.today() + ".csv", [header].concat(data));
  }

  /* Data ------------------------------------------------------------------ */
  async function loadCore() {
    var res = await Promise.all([
      sb.from("profiles").select("*").order("created_at", { ascending: false }),
      sb.from("staff_documents").select("*").order("created_at", { ascending: false }),
      sb.from("job_assignments").select("*").order("work_date", { ascending: true }).limit(100),
      sb.from("projects").select("*").order("name", { ascending: true }),
    ]);
    var bad = res.find(function (r) { return r.error; });
    if (bad) {
      NS.$("#view").innerHTML = '<div class="alert error">' + NS.esc(bad.error.message) + "</div>";
      return false;
    }
    profiles = res[0].data || [];
    docs = res[1].data || [];
    jobs = (res[2].data || []).filter(function (j) { return j.status !== "cancelled"; });
    projects = res[3].data || [];
    photos = await NS.avatarUrls(profiles, docs);
    return true;
  }

  async function loadFinance() {
    var res = await Promise.all([
      sb.from("invoices").select("*").is("deleted_at", null).order("issue_date", { ascending: false }),
      sb.from("expenses").select("*").is("deleted_at", null).order("expense_date", { ascending: false }),
    ]);
    invoices = res[0].data || [];
    expenses = res[1].data || [];
  }

  async function boot() {
    var ctx = await NS.guard(["admin", "owner"]);
    if (!ctx) return;
    me = ctx.profile;
    NS.mountHeader(me);
    var ok = await loadCore();
    if (!ok) return;
    await loadFinance();
    draw();
  }

  NS.$("#loadingText").textContent = t("loading");

  NS.$("#tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    selected.clear();
    draw();
  });

  NS.onLang(function () {
    NS.$("#loadingText").textContent = t("loading");
    if (me) {
      NS.mountHeader(me);
      draw();
    }
  });

  boot();
})();
</script>
</body>
</html>
