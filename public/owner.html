      host.onchange = null;

    if (tab === "overview") drawOverview();
    else if (tab === "users") drawUsers();
    else if (tab === "audit") drawAudit();
    else if (tab === "leads") drawLeads();
    else drawReport();
  }

  /* Period ---------------------------------------------------------------- */
  function computePeriod(kind) {
    var now = new Date();
    var start;
    var end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (kind === "month") start = new Date(now.getFullYear(), now.getMonth(), 1);
    else if (kind === "quarter") start = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
    else if (kind === "year") start = new Date(now.getFullYear(), 0, 1);
    else start = new Date(end.getTime() - 29 * 86400000);
    return { start: iso(start), end: iso(end) };
  }

  function iso(d) {
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }

  function inRange(dateStr) {
    if (!dateStr) return false;
    var d = String(dateStr).slice(0, 10);
    return d >= period.start && d <= period.end;
  }

  function categoryTotals(rows) {
    var out = {};
    rows.forEach(function (r) {
      var k = r.category || "other";
      out[k] = (out[k] || 0) + (Number(r.amount) || 0);
    });
    return out;
  }

  function topProjectRows(rows) {
    var totals = {};
    rows.forEach(function (r) {
      if (!r.project_id) return;
      totals[r.project_id] = (totals[r.project_id] || 0) + (Number(r.amount) || 0);
    });
    return Object.keys(totals)
      .map(function (id) {
        var pr = projects.find(function (x) { return x.id === id; });
        return { id: id, name: pr ? pr.name : id, total: totals[id] };
      })
      .sort(function (a, b) { return b.total - a.total; })
      .slice(0, 5);
  }

  /* Overview -------------------------------------------------------------- */
  function drawOverview() {
    var teamActive = profiles.filter(function (p) { return NS.APPROVED.includes(p.status); }).length;
    var teamPending = profiles.filter(function (p) { return p.status === "pending"; }).length;
    var docsPending = docs.filter(function (d) { return d.status === "pending"; }).length;
    var inPeriod = invoices.filter(function (r) { return inRange(r.issue_date); });
    var exPeriod = expenses.filter(function (r) { return inRange(r.expense_date); });
    var invTotal = inPeriod.reduce(function (s, r) { return s + (Number(r.total) || 0); }, 0);
    var exTotal = exPeriod.reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0);
    var newLeads = leads.filter(function (l) { return inRange(l.created_at); });
    var expiring = docs.filter(function (d) {
      if (!d.expires_on) return false;
      var end = new Date(d.expires_on + "T23:59:59").getTime();
      return end < Date.now() + 30 * 86400000;
    });
    var transportTotal = exPeriod.reduce(function (s, r) {
      return s + (r.category === "transport" ? Number(r.amount) || 0 : 0);
    }, 0);
    var transportShare = exTotal > 0 ? (transportTotal / exTotal) * 100 : 0;
    var openInvoices = invoices.filter(function (r) { return r.status !== "paid"; });
    var unpaidTotal = openInvoices.reduce(function (s, r) { return s + (Number(r.total) || 0); }, 0);
    var today = NS.today();
    var overdueInvoices = openInvoices.filter(function (r) { return r.due_date && r.due_date < today; });
    var overdueTotal = overdueInvoices.reduce(function (s, r) { return s + (Number(r.total) || 0); }, 0);
    var topRows = topProjectRows(exPeriod);

    var topHtml = topRows.length
      ? '<div class="table-wrap"><table><thead><tr><th>' + NS.esc(t("projectName")) + "</th><th>" +
        NS.esc(t("projectCost")) + "</th></tr></thead><tbody>" +
        topRows.map(function (r) {
          return "<tr><td>" + NS.esc(r.name) + "</td><td>" + NS.esc(NS.fmtMoney(r.total)) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty">' + NS.esc(t("noTopProjects")) + "</div>";

    var periods = [["30d", t("p30")], ["month", t("pMonth")], ["quarter", t("pQuarter")], ["year", t("pYear")], ["custom", t("pCustom")]];

    var alertHtml = "";
    if (expiring.length) {
      alertHtml = '<div class="alert"><b>' + NS.esc(t("alerts")) + ":</b><ul style=\"margin:.4rem 0 0;padding-inline-start:1.2rem\">" +
        expiring.slice(0, 6).map(function (d) {
          var p = profiles.find(function (x) { return x.id === d.profile_id; }) || {};
          var expired = new Date(d.expires_on + "T23:59:59").getTime() < Date.now();
          return '<li><div class="row">' + NS.avatarHtml(p.full_name, photos[p.id]) + "<span>" +
            NS.esc(p.full_name || d.profile_id) + " · " +
            NS.esc((NS.t("dt") || {})[d.doc_type] || d.doc_type) + " · " +
            NS.esc(NS.fmtDate(d.expires_on)) + " " +
            '<span class="badge ' + (expired ? "rejected" : "pending") + '">' +
            NS.esc(expired ? t("expiredLabel") : t("expiringSoon")) + "</span></span></div></li>";
        }).join("") + "</ul></div>";
    }

    NS.$("#view").innerHTML =
      '<div class="card" style="margin-bottom:1rem"><div class="row">' +
      '<label for="periodKind" style="margin:0">' + NS.esc(t("period")) + "</label>" +
      '<select id="periodKind" style="max-width:180px">' +
      periods.map(function (p) {
        return '<option value="' + p[0] + '"' + (periodKind === p[0] ? " selected" : "") + ">" + NS.esc(p[1]) + "</option>";
      }).join("") + "</select>" +
      '<label for="pStart" style="margin:0">' + NS.esc(t("from")) + "</label>" +
      '<input id="pStart" type="date" value="' + NS.esc(period.start) + '" style="max-width:170px">' +
      '<label for="pEnd" style="margin:0">' + NS.esc(t("to")) + "</label>" +
      '<input id="pEnd" type="date" value="' + NS.esc(period.end) + '" style="max-width:170px">' +
      "</div></div>" +
      alertHtml +
      '<div class="grid" style="margin:1rem 0">' +
      '<div class="kpi good"><b>' + NS.fmtNum(teamActive) + "</b><span>" + NS.esc(t("kpiStaff")) + "</span></div>" +
      '<div class="kpi warn"><b>' + NS.fmtNum(teamPending) + "</b><span>" + NS.esc(t("kpiPending")) + "</span></div>" +
      '<div class="kpi warn"><b>' + NS.fmtNum(docsPending) + "</b><span>" + NS.esc(t("kpiDocs")) + "</span></div>" +
      '<div class="kpi"><b>' + NS.esc(NS.fmtMoney(invTotal)) + "</b><span>" + NS.esc(t("kpiInvoices")) + "</span></div>" +
      '<div class="kpi bad"><b>' + NS.esc(NS.fmtMoney(exTotal)) + "</b><span>" + NS.esc(t("kpiExpenses")) + "</span></div>" +
      '<div class="kpi ' + (invTotal - exTotal >= 0 ? "good" : "bad") + '"><b>' + NS.esc(NS.fmtMoney(invTotal - exTotal)) + "</b><span>" + NS.esc(t("kpiNet")) + "</span></div>" +
      '<div class="kpi"><b>' + NS.fmtNum(newLeads.length) + "</b><span>" + NS.esc(t("kpiLeads")) + "</span></div>" +
      '<div class="kpi warn"><b>' + NS.fmtNum(expiring.length) + "</b><span>" + NS.esc(t("kpiExpiring")) + "</span></div>" +
      '<div class="kpi"><b>' + NS.esc(NS.fmtMoney(transportTotal)) + "</b><span>" + NS.esc(t("kpiTransport")) + " · " + Math.round(transportShare) + "%</span></div>" +
      '<div class="kpi bad"><b>' + NS.esc(NS.fmtMoney(unpaidTotal)) + "</b><span>" + NS.esc(t("kpiReceivables")) + "</span></div>" +
      '<div class="kpi warn"><b>' + NS.esc(NS.fmtMoney(overdueTotal)) + "</b><span>" + NS.esc(t("kpiOverdue")) + " · " + NS.fmtNum(overdueInvoices.length) + "</span></div>" +
      "</div>" +
      '<div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">' +
      '<div class="card"><h2>' + NS.esc(t("chartCash")) + '</h2><div class="chart-box"><canvas id="cashChart"></canvas></div></div>' +
      '<div class="card"><h2>' + NS.esc(t("chartTeam")) + '</h2><div class="chart-box"><canvas id="teamChart"></canvas></div></div>' +
      "</div>" +
      '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:1rem">' +
      '<div class="card"><h2>' + NS.esc(t("chartExpensesCat")) + '</h2><div class="chart-box"><canvas id="expenseChart"></canvas></div></div>' +
      '<div class="card"><h2>' + NS.esc(t("topProjects")) + "</h2>" + topHtml + "</div>" +
      "</div>";

    NS.$("#periodKind").addEventListener("change", function (e) {
      periodKind = e.target.value;
      if (periodKind !== "custom") period = computePeriod(periodKind);
      drawOverview();
    });
    NS.$("#pStart").addEventListener("change", function (e) {
      period.start = e.target.value;
      periodKind = "custom";
      drawOverview();
    });
    NS.$("#pEnd").addEventListener("change", function (e) {
      period.end = e.target.value;
      periodKind = "custom";
      drawOverview();
    });

    buildCharts();
  }

  function cssVar(name, fallback) {
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || fallback;
    } catch (_) {
      return fallback;
    }
  }

  function destroyCharts() {
    charts.forEach(function (c) {
      try { c.destroy(); } catch (_) { /* ignore */ }
    });
    charts = [];
  }

  function buildCharts() {
    if (!window.Chart) return;
    var ink = cssVar("--ink", "#14202b");
    var line = cssVar("--line", "#d9e1e8");
    var em = cssVar("--em", "#0f6b4f");
    var gold = cssVar("--gold", "#d4a017");
    var bad = cssVar("--bad", "#b91c1c");
    var mute = cssVar("--mute", "#5d6d7b");

    Chart.defaults.color = ink;
    Chart.defaults.borderColor = line;

    var months = [];
    var invSeries = [];
    var exSeries = [];
    var now = new Date();
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      months.push(
        d.toLocaleDateString(NS.lang === "ar" ? "ar-QA" : "en-GB", { month: "short", year: "2-digit" })
      );
      invSeries.push(
        invoices
          .filter(function (r) { return String(r.issue_date || "").slice(0, 7) === key; })
          .reduce(function (s, r) { return s + (Number(r.total) || 0); }, 0)
      );
      exSeries.push(
        expenses
          .filter(function (r) { return String(r.expense_date || "").slice(0, 7) === key; })
          .reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0)
      );
    }

        if (res.error) return NS.toast(res.error.message, "error");
        var p = profiles.find(function (x) { return x.id === id; });

        }).eq("id", pid);
        if (out.error) return NS.toast(out.error.message, "error");
        var prof = profiles.find(function (x) { return x.id === pid; });
        if (prof) {
          prof.status = status;
          prof.rejection_reason = status === "rejected" ? reason : null;
        }
        NS.toast(t("statusChanged"));
      }
    };
  }

  function figureRows(m) {
    if (!m || !m.invoices) return "";
    var comp = m.comparison || {};
    var money = function (v) { return NS.esc(NS.fmtMoney(v || 0)); };
    var prev = function (d) {
      if (!d) return "";
      var change = [];
      if (d.absolute != null) change.push((d.absolute > 0 ? "+" : "") + NS.fmtMoney(d.absolute));
      if (d.percent != null) change.push((d.percent > 0 ? "+" : "") + NS.fmtNum(d.percent) + "%");
      return NS.esc(t("figPrevious")) + ": " + money(d.previous) +
        (change.length ? " (" + NS.esc(change.join(", ")) + ")" : "");
    };
    var row = function (label, value, note) {
      return "<tr><th>" + NS.esc(label) + "</th><td>" + value + '</td><td class="note">' + (note || "") + "</td></tr>";
    };

    var rows = "";
    rows += row(t("figRevenue"), money((m.invoices || {}).total), prev(comp.revenue));
    rows += row(t("figExpenses"), money((m.expenses || {}).total), prev(comp.expenses));
    rows += row(t("figNet"), money(m.net), prev(comp.net));
    rows += row(t("figTransport"), money((m.transport || {}).total) + ' <span class="note">(' +
      NS.fmtNum((m.transport || {}).share_percent || 0) + "% " + NS.esc(t("figTransportShare")) + ")</span>", "");
    var rec = m.receivables || {};
    rows += row(t("figUnpaid"), money(rec.unpaid_total) + ' <span class="note">(' + NS.fmtNum(rec.unpaid_count || 0) + ")</span>",
      NS.esc(t("figOverdue")) + ": " + money(rec.overdue_total) + " (" + NS.fmtNum(rec.overdue_count || 0) + ")");
    rows += row(t("figDocs"), NS.fmtNum((m.documents || {}).expiring_30d || 0), "");
    rows += row(t("figPending"), NS.fmtNum((m.pending_approvals || {}).total || 0), "");
    rows += row(t("figLeads"), NS.fmtNum((m.leads || {}).conversion_percent || 0) + "%",
      NS.fmtNum((m.leads || {}).converted || 0) + " / " + NS.fmtNum((m.leads || {}).count || 0));

    var cats = (m.expenses || {}).by_category || {};
    var keys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
    if (keys.length) {
      rows += '<tr><th colspan="3">' + NS.esc(t("figCategories")) + "</th></tr>";
      keys.forEach(function (k) {
        rows += "<tr><td>" + NS.esc(catLabel(k)) + "</td><td>" + money(cats[k]) + "</td><td></td></tr>";
      });
    }
    return '<div class="table-wrap"><table class="report-figures"><tbody>' + rows + "</tbody></table></div>";
  }

  function renderReport(r) {
    currentReport = r;
    var out = NS.$("#reportOut");
    if (!out) return;
    var head = '<header class="report-head"><div class="between">' +
      '<div><h2>New Space</h2><span class="note">' + NS.esc(t("reportTitle")) + "</span></div>" +
      '<div class="note" style="text-align:end">' + NS.esc(t("from")) + " " + NS.esc(NS.fmtDate(r.period_start)) +
      " · " + NS.esc(t("to")) + " " + NS.esc(NS.fmtDate(r.period_end)) + "<br>" +
      NS.esc(t("generatedAt")) + ": " + NS.esc(NS.fmtDateTime(r.created_at)) + "</div></div></header>";
    out.innerHTML = head + figureRows(r.metrics) +
      '<div class="divider"></div>' + md(r.content);
  }

  function md(text) {
    var safe = NS.esc(String(text || ""));
    var lines = safe.split(/\r?\n/);
    var out = "";
    var inList = false;
    lines.forEach(function (line) {
      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        if (inList) { out += "</ul>"; inList = false; }
        out += "<h3>" + h[2] + "</h3>";
        return;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        if (!inList) { out += "<ul>"; inList = true; }
        out += "<li>" + line.replace(/^\s*[-*]\s+/, "") + "</li>";
        return;
      }
      if (inList) { out += "</ul>"; inList = false; }
      if (line.trim() === "") return;
      out += "<p>" + line + "</p>";
    });
    if (inList) out += "</ul>";
    return out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  async function generateReport() {
    if (saving) return;
    var start = NS.$("#rStart").value;
    var end = NS.$("#rEnd").value;
    if (!start || !end || start > end) return NS.toast(t("reportError"), "error");

    saving = true;
    var btn = NS.$("#genReport");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + NS.esc(t("generating"));

    try {
      var sess = await sb.auth.getSession();
      var token = sess && sess.data && sess.data.session ? sess.data.session.access_token : "";
      if (!token) throw new Error("no_session");

      var res = await fetch("/api/report", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({ start: start, end: end, lang: reportLang }),
      });
      var body = await res.json().catch(function () { return {}; });

      if (!res.ok) {
        var msg = body.error || t("reportError");
        if (res.status === 429) msg = t("rateLimited");
        if (res.status === 403) msg = t("ownerOnly");
        if (res.status === 404) msg = t("notConfigured");
        throw new Error(msg);
      }

      currentReport = {
        id: null,
        period_start: body.metrics.period_start,
        period_end: body.metrics.period_end,
        metrics: body.metrics || {},
        content: body.content,
        created_at: new Date().toISOString(),
      };
      renderReport(currentReport);
      NS.toast(t("savedReport"));
      await loadReports();
    } catch (err) {
      NS.toast(err && err.message ? err.message : t("reportError"), "error");
    } finally {
      saving = false;
      btn.disabled = false;
      btn.textContent = t("generate");
    }
  }

  async function loadData() {
    var res = await Promise.all([
      sb.from("profiles").select("*").order("created_at", { ascending: false }),
      sb.from("staff_documents").select("*").order("created_at", { ascending: false }),
      sb.from("invoices").select("*").is("deleted_at", null),
      sb.from("expenses").select("*").is("deleted_at", null),
      sb.from("leads").select("*").order("created_at", { ascending: false }).limit(1000),
      sb.from("audit_log").select("*").order("created_at", { ascending: false }).limit(200),
      sb.from("projects").select("*").order("name", { ascending: true }),
    ]);
    var bad = res.find(function (r) { return r.error; });
    if (bad) {
      NS.$("#view").innerHTML = '<div class="alert error">' + NS.esc(bad.error.message) + "</div>";
      return false;
    }
    profiles = res[0].data || [];
    docs = res[1].data || [];
    invoices = res[2].data || [];
    expenses = res[3].data || [];
    leads = res[4].data || [];
    audit = res[5].data || [];
    projects = res[6].data || [];
    photos = await NS.avatarUrls(profiles, docs);
    await loadReports();
    return true;
  }

  NS.$("#loadingText").textContent = t("loading");

  NS.$("#tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    draw();
  });

  NS.onLang(function () {
    NS.$("#loadingText").textContent = t("loading");
    if (me) {
      NS.mountHeader(me);
      draw();
    }
  });

  if (window.MutationObserver) {
    new MutationObserver(function () {
      if (me && tab === "overview") {
        destroyCharts();
        buildCharts();
      }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }

  boot();
})();
</script>
</body>
</html>
