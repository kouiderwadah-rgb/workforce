<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}.w{max-width:1080px;margin:0 auto;padding:0 1.2rem}

.btn{display:inline-block;background:var(--acc);color:#04130d;border:0;border-radius:8px;padding:.6rem 1.3rem;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.o{background:none;color:#fff;border:1px solid rgba(255,255,255,.4)}.btn.dk{background:var(--em);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--navy),#0d3b2e);color:#fff;padding:4.5rem 0 4rem}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.25;margin:0 0 1rem;max-width:18ch}.hero p{color:#bcd;max-width:56ch;font-size:1.1rem;margin:0 0 1.6rem}
.hero .row{display:flex;gap:.8rem;flex-wrap:wrap}.tag{color:var(--gold);font-weight:500;margin-bottom:.6rem}
section{padding:3.5rem 0}h2{font-size:1.7rem;margin:0 0 .4rem}.sub{color:var(--mute);margin:0 0 1.8rem;max-width:60ch}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.3rem}.card h3{margin:.2rem 0 .4rem;font-size:1.1rem}.card p{margin:0;color:var(--mute)}
.ic{width:38px;height:38px;border-radius:9px;background:rgba(16,185,129,.14);color:var(--em);display:grid;place-items:center;font-weight:700}
.alt{background:var(--card);border-block:1px solid var(--line)}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1200;margin-bottom:.5rem}
.cta{background:var(--navy);color:#fff;border-radius:14px;padding:2rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}.cta p{color:#bcd;margin:.2rem 0 0}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.4rem;display:grid;gap:.7rem;grid-template-columns:1fr 1fr}
@media(max-width:640px){form{grid-template-columns:1fr}}.full{grid-column:1/-1}
label{display:block;font-weight:500;margin-bottom:.2rem}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.hp{position:absolute;inset-inline-start:-9999px}#fm{grid-column:1/-1;padding:.5rem .7rem;border-radius:8px}#fm:empty{display:none}
footer{background:var(--navy);color:#9db;padding:2rem 0;text-align:center;font-size:.92rem}
