<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04141a">
<title>New Space | Workforce Solutions Qatar</title>
<meta name="description" content="New Space — manpower supply and event staffing in Qatar / نيو سبيس لتوريد العمالة والكوادر في قطر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1a14;--bg:#f5f8f7;--surface:#ffffff;--surface-2:#eef4f1;
  --line:#dde8e2;--mute:#5c6f67;
  --navy:#04141a;--em:#0b8f63;--em-2:#12b981;--em-strong:#0b7a53;
  --em-soft:rgba(16,185,129,.12);
  --gold:#e2b24c;--gold-2:#f2c76a;--gold-soft:rgba(226,178,76,.16);
  --radius:18px;
  --shadow-md:0 30px 70px -34px rgba(6,40,30,.45);
  --shadow-sm:0 1px 2px rgba(6,28,34,.05),0 12px 30px -22px rgba(6,28,34,.4);
  --maxw:1160px;
}
@media(prefers-color-scheme:dark){
  :root{--ink:#e9f1ee;--bg:#07110f;--surface:#0e1c18;--surface-2:#12241e;--line:#22352d;--mute:#9ab0a6}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
svg{display:block}
.w{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:1.35rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:fixed;inset-inline-start:1rem;top:-70px;z-index:100;background:var(--gold);color:#1a1200;padding:.6rem 1rem;border-radius:10px;font-weight:700;text-decoration:none;transition:top .2s}
.skip:focus{top:1rem}

/* ---------- header ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(4,20,26,.72);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid transparent;transition:background .3s,box-shadow .3s,border-color .3s}
.site-header.scrolled{background:rgba(4,18,24,.92);border-bottom-color:rgba(255,255,255,.08);box-shadow:0 14px 40px -30px #000}
.navwrap{display:flex;align-items:center;gap:1rem;height:74px}
.brand{display:inline-flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.navwrap .brand{margin-inline-end:auto}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--em-2),var(--em-strong));display:grid;place-items:center;box-shadow:0 10px 20px -9px rgba(16,185,129,.8);flex:none}
.logo-mark svg{width:19px;height:19px}
.nav{display:flex;align-items:center;gap:.2rem}
.nav a{color:#c8dcd6;text-decoration:none;font-size:.95rem;font-weight:500;padding:.5rem .8rem;border-radius:9px;transition:color .2s,background .2s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-actions{display:flex;align-items:center;gap:.55rem}
.langbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;font:inherit;font-size:.84rem;font-weight:600;padding:.5rem .8rem;border-radius:999px;cursor:pointer;transition:.2s;min-width:76px}
.langbtn:hover{background:rgba(255,255,255,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:.72rem 1.4rem;font:inherit;font-size:.95rem;font-weight:600;line-height:1;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,border-color .18s}
.btn-primary{background:linear-gradient(135deg,var(--em-2),var(--em-strong));color:#04130d;box-shadow:0 14px 28px -16px rgba(16,185,129,.9)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 36px -16px rgba(16,185,129,.9)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-signin{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;padding:.55rem 1.05rem}
.btn-signin:hover{background:rgba(255,255,255,.16)}
.menu{display:none;width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);cursor:pointer;place-items:center;padding:0}
.menu span{display:block;width:18px;height:2px;background:#fff;border-radius:2px;position:relative;transition:.2s}
.menu span::before,.menu span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:#fff;border-radius:2px;transition:.2s}
.menu span::before{top:-6px}.menu span::after{top:6px}
.menu[aria-expanded="true"] span{background:transparent}
.menu[aria-expanded="true"] span::before{top:0;transform:rotate(45deg)}
.menu[aria-expanded="true"] span::after{top:0;transform:rotate(-45deg)}
.nav-signin{display:none}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:#04141a;color:#fff;padding:clamp(3.2rem,7vw,6rem) 0 clamp(2.6rem,6vw,3.6rem);margin-top:-74px;padding-top:calc(clamp(3.2rem,7vw,6rem) + 74px)}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(58% 66% at 86% 6%,rgba(16,185,129,.30),transparent 60%),
  radial-gradient(50% 60% at 8% 94%,rgba(226,178,76,.18),transparent 60%),
  radial-gradient(125% 125% at 72% 0%,#0a3a38 0%,#061f26 46%,#04141a 100%)}
.hero-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(72% 62% at 68% 28%,#000,transparent 76%);mask-image:radial-gradient(72% 62% at 68% 28%,#000,transparent 76%)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;display:block}
.hero-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(4,20,26,.72) 0%,rgba(4,20,26,.5) 45%,rgba(4,20,26,.85) 100%)}
.hero .w{position:relative;z-index:3}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,4rem);align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#ecd9a6;padding:.42rem .9rem;border-radius:999px;font-size:.82rem;font-weight:600;margin-bottom:1.4rem}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(226,178,76,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,178,76,.5)}70%{box-shadow:0 0 0 9px rgba(226,178,76,0)}100%{box-shadow:0 0 0 0 rgba(226,178,76,0)}}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.7rem);line-height:1.15;font-weight:700;margin:0 0 1.1rem;max-width:17ch}
.hero .lead{color:rgba(226,240,236,.72);font-size:clamp(1rem,1.4vw,1.15rem);max-width:52ch;margin:0 0 1.9rem}
.hero-cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:2.4rem}
.stats{display:flex;gap:.9rem;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:1.5rem}
.stat{padding-inline-start:.95rem;border-inline-start:2px solid rgba(226,178,76,.55)}
.stat b{display:block;font-size:1.6rem;font-weight:700;line-height:1.15;background:linear-gradient(120deg,#fff,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.84rem;color:rgba(214,235,228,.6)}

/* hero visual */
.hero-visual{position:relative;max-width:440px;width:100%;margin-inline:auto}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 40px 80px -40px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.16)}
.deploy{padding:1.4rem;position:relative;z-index:2;animation:float 8s ease-in-out infinite}
.deploy-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.live{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;color:#bdf0d9}
.live .pulse{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse2 2s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.deploy-loc{font-size:.78rem;color:rgba(214,235,228,.55)}
.deploy-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:rgba(214,235,228,.5);margin-bottom:.8rem}
.shifts{display:grid;gap:.55rem}
.shift{display:flex;align-items:center;gap:.75rem;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:.6rem .75rem}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#04130d;background:linear-gradient(135deg,#6ee7b7,#10b981);flex:none}
.av.g{background:linear-gradient(135deg,#fcd34d,#f59e0b)}
.av.t{background:linear-gradient(135deg,#93c5fd,#3b82f6)}
.shift-meta{display:flex;flex-direction:column;margin-inline-end:auto;line-height:1.3;min-width:0}
.shift-meta b{font-size:.86rem;font-weight:600;color:#eefaf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift-meta small{font-size:.72rem;color:rgba(214,235,228,.55);font-variant-numeric:tabular-nums}
.on{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;color:#6ee7b7;font-weight:600;white-space:nowrap}
.on i{width:6px;height:6px;border-radius:50%;background:#34d399}
.deploy-foot{display:flex;gap:.8rem;margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid rgba(255,255,255,.1)}
.metric{flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:.7rem .8rem}
.metric b{display:block;font-size:1.3rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.metric span{font-size:.72rem;color:rgba(214,235,228,.55)}
.float-badge{position:absolute;z-index:3;display:flex;align-items:center;gap:.6rem;background:rgba(6,28,34,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:.6rem .85rem;box-shadow:0 24px 44px -22px rgba(0,0,0,.85);backdrop-filter:blur(8px)}
.float-badge .fb-ic{width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.float-badge .fb-ic svg{width:15px;height:15px}
.float-badge b{font-size:.85rem;color:#fff;display:block;line-height:1.2}
.float-badge small{font-size:.7rem;color:rgba(214,235,228,.6)}
.b1{top:-1.1rem;inset-inline-end:-.7rem;animation:float 7s ease-in-out infinite .4s}
.b2{bottom:-1.2rem;inset-inline-start:-.8rem;animation:float 9s ease-in-out infinite .9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.trust{position:relative;z-index:1;margin-top:clamp(2.4rem,6vw,3.6rem);padding-top:1.6rem;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.trust>span{font-size:.82rem;color:rgba(214,235,228,.55);font-weight:500}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{font-size:.8rem;color:#d7ece5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:.32rem .8rem;border-radius:999px}

/* ---------- sections ---------- */
.sec{padding:clamp(3.5rem,7vw,5.5rem) 0}
.sec.alt{background:var(--surface-2);border-block:1px solid var(--line)}
.sec-head{max-width:620px;margin-bottom:clamp(1.8rem,4vw,2.8rem)}
.sec-head h2{font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.2;margin:0 0 .6rem;font-weight:700}
.sec-head p{color:var(--mute);font-size:1.05rem;margin:0;max-width:58ch}

/* services */
.cards{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.svc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.7rem 1.5rem;transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.svc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,var(--em-soft),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.svc:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:rgba(16,185,129,.35)}
.svc:hover::before{opacity:1}
.svc>*{position:relative;z-index:1}
.svc-ic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(16,185,129,.06));color:var(--em-2);display:grid;place-items:center;margin-bottom:1.1rem;border:1px solid rgba(16,185,129,.18)}
.svc-ic svg{width:26px;height:26px}
.svc h3{font-size:1.12rem;margin:0 0 .4rem}
.svc p{margin:0;color:var(--mute);font-size:.95rem}
.svc-num{position:absolute;top:1.15rem;inset-inline-end:1.25rem;font-size:.82rem;font-weight:700;color:var(--mute);opacity:.5}

/* steps */
.steps{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.6rem 1.4rem;overflow:hidden}
.step-num{position:absolute;top:.5rem;inset-inline-end:1rem;font-size:2.7rem;font-weight:700;line-height:1;color:var(--em);opacity:.12}
.step-ic{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--gold-2),#caa23f);color:#241a00;display:grid;place-items:center;margin-bottom:1rem;box-shadow:0 12px 22px -14px rgba(226,178,76,.9)}
.step-ic svg{width:23px;height:23px}
.step h3{font-size:1.05rem;margin:0 0 .35rem}
.step p{margin:0;color:var(--mute);font-size:.93rem}

/* why */
.why{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(2rem,5vw,3.5rem);align-items:center}
.why-list{display:grid;gap:.8rem}
.why-item{display:flex;gap:1rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:1.1rem 1.2rem;transition:transform .2s,border-color .2s,box-shadow .2s}
.why-item:hover{transform:translateY(-2px);border-color:rgba(16,185,129,.35);box-shadow:var(--shadow-sm)}
.why-ic{flex:none;width:38px;height:38px;border-radius:11px;background:var(--em-soft);color:var(--em-2);display:grid;place-items:center;border:1px solid rgba(16,185,129,.2)}
.why-ic svg{width:20px;height:20px}
.why-ic.sm{width:22px;height:22px;border-radius:7px}
.why-ic.sm svg{width:13px;height:13px}
.why-item h3{font-size:1.02rem;margin:.1rem 0 .2rem}
.why-item p{margin:0;color:var(--mute);font-size:.9rem}

/* request */
.req{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(2rem,5vw,3.5rem);align-items:start}
.req-info h2{font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.2;margin:0 0 .6rem}
.req-info>p{color:var(--mute);margin:0 0 1.7rem;max-width:46ch}
.rwhy{list-style:none;padding:0;margin:0;display:grid;gap:.75rem}
.rwhy li{display:flex;align-items:center;gap:.7rem;color:var(--ink);font-weight:500;font-size:.95rem}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(1.3rem,3vw,2rem);box-shadow:var(--shadow-md)}
#lead{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.full{grid-column:1/-1}
#lead label{font-weight:600;font-size:.86rem;color:var(--ink)}
#lead input,#lead select,#lead textarea{width:100%;padding:.72rem .85rem;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
#lead input:focus,#lead select:focus,#lead textarea:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--em-soft)}
#lead textarea{resize:vertical;min-height:112px}
.hp{position:absolute;inset-inline-start:-9999px}
.fm{grid-column:1/-1;border-radius:11px;padding:.7rem .9rem;font-size:.9rem;line-height:1.45}
.fm:empty{display:none}
.fm.ok{background:var(--em-soft);border:1px solid rgba(16,185,129,.35);color:var(--em-strong)}
.fm.bad{background:rgba(185,28,28,.1);border:1px solid rgba(185,28,28,.35);color:#b91c1c}
@media(prefers-color-scheme:dark){.fm.ok{color:#6ee7b7}.fm.bad{color:#fca5a5}}
.submit{width:100%}
@media(prefers-color-scheme:dark){#lead input,#lead select,#lead textarea{background:var(--surface-2)}}

/* join */
.join{position:relative;overflow:hidden;background:radial-gradient(120% 160% at 100% 0%,#0c4a43,#051c22 72%);border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:clamp(2rem,5vw,3.2rem);display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap;color:#fff;box-shadow:var(--shadow-md)}
.join::after{content:"";position:absolute;inset:0;background:radial-gradient(42% 60% at 92% 12%,rgba(226,178,76,.28),transparent 60%);pointer-events:none}
.join::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 80% at 90% 10%,#000,transparent 70%);mask-image:radial-gradient(60% 80% at 90% 10%,#000,transparent 70%);pointer-events:none}
.join>*{position:relative;z-index:1}
.join h2{font-size:clamp(1.5rem,3.2vw,2.1rem);margin:0 0 .4rem}
.join p{color:rgba(214,235,228,.72);margin:0;max-width:50ch}

/* footer */
footer{background:#04141a;color:#9db3ac;padding:3.5rem 0 1.8rem}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:2.5rem}
.foot-brand .brand{color:#fff}
.foot-brand p{color:#8aa39b;max-width:36ch;margin:1rem 0 0;font-size:.92rem}
.foot-col h4{margin:0 0 .9rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:#c7d8d2;font-weight:600}
.foot-col a{display:block;color:#9db3ac;text-decoration:none;padding:.28rem 0;font-size:.92rem;transition:color .2s}
.foot-col a:hover{color:#fff}
.foot-bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:2.5rem;padding-top:1.4rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:#7f978f}

/* reveal + responsive */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.hero-copy>*{animation:rise .8s both}
.hero-copy>*:nth-child(2){animation-delay:.08s}
.hero-copy>*:nth-child(3){animation-delay:.16s}
.hero-copy>*:nth-child(4){animation-delay:.24s}
.hero-copy>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.hero-copy>*,.deploy,.float-badge{animation:none!important}.eyebrow .dot,.live .pulse{animation:none!important}}
@media(max-width:960px){
  .hero-grid,.why,.req{grid-template-columns:1fr}
  .hero-visual{margin-top:.5rem}
  .foot-grid{grid-template-columns:1fr 1fr}
  .foot-brand{grid-column:1/-1}
}
@media(max-width:900px){
  .nav{position:absolute;inset-inline:1rem;top:calc(100% - .5rem);flex-direction:column;align-items:stretch;background:rgba(6,24,30,.98);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:.6rem;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.22s}
  .nav.open{opacity:1;visibility:visible;transform:none}
  .nav a{padding:.8rem .9rem}
  .nav-signin{display:block;color:#6ee7b7}
  .menu{display:grid}
  .btn-signin{display:none}
}
@media(max-width:640px){
  #lead{grid-template-columns:1fr}
  .float-badge{display:none}
  .stats{gap:.7rem}
  .stat b{font-size:1.35rem}
  .foot-grid{grid-template-columns:1fr}
  .foot-bottom{flex-direction:column}
  .hero{margin-top:-74px;padding-top:calc(2.6rem + 74px)}

function setupReveal(){
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return}

  document.querySelectorAll(".reveal:not(.in)").forEach(e=>io.observe(e));
}
