<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212B;--bg:#F8FAFC;--deep:#0A1F18;--mid:#14533D;--acc:#10B981;--gold:#F59E0B;--card:#fff;--line:#dbe3ea;--mute:#5b6b79}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef3;--bg:#0c1511;--card:#13221b;--line:#24382e;--mute:#9db0a5}}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--deep);color:#fff;display:flex;gap:1rem;align-items:center;padding:.7rem 1.2rem;flex-wrap:wrap}
header b{font-size:1.05rem;margin-inline-end:auto}
nav button,.lang{background:none;border:0;color:#cfe;font:inherit;padding:.4rem .8rem;border-radius:6px;cursor:pointer}
nav button[aria-current=true]{background:var(--mid);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:1.5rem 1.2rem 4rem}
.hero{background:var(--deep);color:#fff;border-radius:14px;padding:2.2rem;display:grid;gap:1.5rem;grid-template-columns:1.2fr 1fr}
.hero h1{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.25;margin:0 0 .6rem}.hero p{color:#bcd;max-width:48ch;margin:0}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.drop{border:2px dashed var(--acc);border-radius:12px;padding:1.4rem;text-align:center;background:rgba(16,185,129,.08);cursor:pointer;display:block}
.drop small{display:block;color:var(--mute)}.hero .drop small{color:#9cb}
.btn{background:var(--acc);color:#04130d;border:0;border-radius:8px;padding:.55rem 1rem;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink);font-weight:500}.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:1.2rem 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem}.kpi b{font-size:1.7rem;display:block}.kpi span{color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:.6rem .8rem;text-align:start;border-bottom:1px solid var(--line)}th{background:rgba(20,83,61,.12);font-weight:500}
.wrap{overflow-x:auto}tr[data-id]{cursor:pointer}tr[data-id]:hover td{background:rgba(16,185,129,.08)}
.badge{padding:.1rem .6rem;border-radius:99px;font-size:.82rem;border:1px solid currentColor;white-space:nowrap}
.s-pending_review,.s-late{color:#b45309}.s-verified,.s-present,.s-approved{color:#0f7a56}.s-failed,.s-absent,.s-rejected{color:#b91c1c}.s-pending_approval{color:#1d4ed8}
.review{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}@media(max-width:860px){.review{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;min-height:300px}
.pane img,.pane object{width:100%;max-height:70vh;border-radius:6px}.pane object{height:60vh}
.f{display:grid;grid-template-columns:9rem 1fr 3.2rem;gap:.5rem;align-items:center;margin-bottom:.45rem}
.f input,.f select{width:100%;padding:.35rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.low{border-color:var(--gold)!important}.conf{font-size:.8rem;color:var(--mute);text-align:end}
.flag{background:rgba(245,158,11,.14);border:1px solid var(--gold);border-radius:8px;padding:.4rem .7rem;margin:.3rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}.note{color:var(--mute);font-size:.9rem}
h2{margin:1.6rem 0 .6rem}[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <b>Workforce Intelligence</b>
  <nav id="nav"></nav>
  <button class="lang" id="lang"></button>
</header>
<main>
<section id="v-home">
  <div class="hero">
    <div><h1 data-i="h1"></h1><p data-i="h1p"></p></div>
    <label class="drop"><input type="file" id="portalFile" accept="application/pdf,image/*" hidden>
      <b data-i="drop"></b><small data-i="dropS"></small></label>
  </div>
  <p class="note" id="portalMsg" role="status"></p>
  <div class="grid" id="feat"></div>
</section>

<section id="v-inbox" hidden>
  <h2 data-i="inbox"></h2>
  <label class="drop"><input type="file" id="inFile" accept="application/pdf,image/*" hidden><b data-i="drop"></b><small data-i="dropS"></small></label>
  <div class="wrap" style="margin-top:1rem"><table><thead><tr><th data-i="file"></th><th data-i="chan"></th><th data-i="type"></th><th data-i="total"></th><th data-i="status"></th></tr></thead><tbody id="docs"></tbody></table></div>
  <div class="review" id="rev" hidden><div class="pane" id="prev"></div><div class="pane" id="fields"></div></div>
</section>

<section id="v-ops" hidden>
  <h2 data-i="ops"></h2>
  <div class="grid" id="kpis"></div>
  <h2 data-i="att"></h2>
  <div class="wrap"><table><thead><tr><th data-i="emp"></th><th data-i="site"></th><th data-i="shift"></th><th data-i="status"></th><th></th></tr></thead><tbody id="att"></tbody></table></div>
  <p class="note" data-i="demo"></p>
</section>
</main>

<script>
const T={ar:{h1:"إدارة العمالة والمستندات في مكان واحد",h1p:"أرسل فاتورتك أو إيصالك بأمان. يقرؤها الوكيل الذكي ويجهّزها، ويعتمدها شخص مخوّل فقط.",drop:"اختر ملفاً أو اسحبه هنا",dropS:"PDF أو صورة، حتى 3 ميغابايت",inbox:"صندوق المستندات",file:"الملف",chan:"القناة",type:"النوع",total:"الإجمالي",status:"الحالة",ops:"لوحة التشغيل",att:"حضور اليوم",emp:"الموظف",site:"الموقع",shift:"النوبة",demo:"بيانات تجريبية محفوظة في متصفحك. الربط بقاعدة بيانات حقيقية في المرحلة التالية.",
home:"الرئيسية",inboxN:"المستندات",opsN:"التشغيل",lang:"English",sent:"تم استلام الملف وهو الآن في المراجعة. لن يُعتمد تلقائياً.",busy:"جارٍ التحليل…",err:"تعذّر التحليل. تحقق من مفتاح GEMINI_API_KEY ثم أعد المحاولة.",big:"الملف أكبر من 3 ميغابايت.",
verify:"تأكيد الحقول",submit:"إرسال للاعتماد",reject:"رفض",hint:"التأكيد غير الاعتماد. الاعتماد المالي للمالك أو الشريك فقط.",flags:"تنبيهات التحقق",
f:{document_type:"النوع",document_number:"الرقم",issuer:"المُصدر",recipient:"المستلم",issue_date:"تاريخ الإصدار",due_date:"الاستحقاق",currency:"العملة",subtotal:"المجموع الفرعي",tax_amount:"الضريبة",discount_amount:"الخصم",grand_total:"الإجمالي"},
S:{pending_review:"بانتظار المراجعة",verified:"تم التأكيد",pending_approval:"بانتظار الاعتماد",rejected:"مرفوض",failed:"فشل",present:"حاضر",late:"متأخر",absent:"غائب"},
ch:{website:"الموقع",portal:"بوابة خارجية"},kp:["العمال","حاضرون","متأخرون","غائبون"],ft:[["استقبال ذكي","يقرأ الفواتير والإيصالات ويستخرج الحقول مع نسبة ثقة لكل حقل."],["مراجعة بشرية","لا يعتمد الذكاء الاصطناعي ولا يدفع ولا يصدر أي فاتورة."],["عربي وإنجليزي","واجهة كاملة بالاتجاهين، والعملة الأساسية QAR."]],mark:"تسجيل حضور",
},en:{h1:"Workforce and documents, in one place",h1p:"Send your invoice or receipt securely. The AI agent reads and prepares it; only an authorised person approves it.",drop:"Choose a file or drop it here",dropS:"PDF or image, up to 3 MB",inbox:"Document inbox",file:"File",chan:"Channel",type:"Type",total:"Total",status:"Status",ops:"Operations",att:"Today's attendance",emp:"Employee",site:"Site",shift:"Shift",demo:"Demo data stored in your browser. A real database comes in the next phase.",
home:"Home",inboxN:"Documents",opsN:"Operations",lang:"العربية",sent:"File received and now in review. It will not be approved automatically.",busy:"Analysing…",err:"Extraction failed. Check the GEMINI_API_KEY setting and try again.",big:"File is larger than 3 MB.",
verify:"Verify fields",submit:"Submit for approval",reject:"Reject",hint:"Verifying is not approving. Financial approval belongs to the Owner or Partner.",flags:"Validation flags",
f:{document_type:"Type",document_number:"Number",issuer:"Issuer",recipient:"Recipient",issue_date:"Issue date",due_date:"Due date",currency:"Currency",subtotal:"Subtotal",tax_amount:"Tax",discount_amount:"Discount",grand_total:"Grand total"},
S:{pending_review:"Pending review",verified:"Verified",pending_approval:"Pending approval",rejected:"Rejected",failed:"Failed",present:"Present",late:"Late",absent:"Absent"},
ch:{website:"Website",portal:"External portal"},kp:["Workers","Present","Late","Absent"],ft:[["Smart intake","Reads invoices and receipts and extracts fields with per-field confidence."],["Human review","The AI never approves, pays or issues an invoice."],["Arabic and English","Full RTL and LTR interface, QAR as base currency."]],mark:"Mark attendance"}};
let L=localStorage.getItem("lang")||"ar",view="home",cur=null;
const $=s=>document.querySelector(s),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let docs=ld("docs",[]),att=ld("att",[["Ahmed K.","Lusail Hall","18:00–02:00","present"],["Sara M.","Lusail Hall","18:00–02:00","late"],["Omar B.","Corniche","10:00–18:00","absent"],["Layla H.","Corniche","10:00–18:00","present"],["Yousef R.","West Bay","14:00–22:00","present"]]);
const t=(k)=>T[L][k],esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=s=>`<span class="badge s-${s}">${esc(T[L].S[s]||s)}</span>`;
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $("#lang").textContent=t("lang");
 $("#nav").innerHTML=[["home","home"],["inbox","inboxN"],["ops","opsN"]].map(([v,k])=>`<button data-v="${v}" ${v==view?'aria-current="true"':""}>${t(k)}</button>`).join("");
 ["home","inbox","ops"].forEach(v=>$("#v-"+v).hidden=v!=view);
 $("#feat").innerHTML=T[L].ft.map(([a,b])=>`<div class="kpi"><b style="font-size:1.1rem">${a}</b><span>${b}</span></div>`).join("");
 $("#docs").innerHTML=docs.map(d=>`<tr data-id="${d.id}"><td>${esc(d.name)}</td><td>${esc(T[L].ch[d.channel])}</td><td>${esc(d.data?.document_type||"—")}</td><td>${d.data?.grand_total!=null?esc(d.data.grand_total+" "+(d.data.currency||"")):"—"}</td><td>${badge(d.status)}</td></tr>`).join("");
 const n=att.length,p=att.filter(a=>a[3]=="present").length,l=att.filter(a=>a[3]=="late").length;
 $("#kpis").innerHTML=[n,p,l,n-p-l].map((v,i)=>`<div class="kpi"><b>${v}</b><span>${t("kp")[i]}</span></div>`).join("");
 $("#att").innerHTML=att.map((a,i)=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td><td>${badge(a[3])}</td><td><button class="btn alt" data-m="${i}">${t("mark")}</button></td></tr>`).join("");
 if(cur)showDoc(cur,true);
}
$("#nav").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
$("#lang").onclick=()=>{L=L=="ar"?"en":"ar";localStorage.setItem("lang",L);render()};
$("#att").onclick=e=>{const i=e.target.dataset.m;if(i!=null){att[i][3]="present";sv("att",att);render()}};
async function ingest(file,channel,msg){
 if(!file)return;if(file.size>3e6){msg(t("big"));return}
 msg(t("busy"));
 const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(file)});
 const doc={id:Date.now()+"",name:file.name,channel,status:"pending_review",data:null,url:URL.createObjectURL(file),mime:file.type};
 try{const r=await fetch("/api/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mime:file.type,data:b64})});
  const j=await r.json();if(!r.ok)throw 0;doc.data=j;msg(t("sent"))}catch{doc.status="failed";msg(t("err"))}
 docs.unshift(doc);sv("docs",docs.map(d=>({...d,url:null})));render();
}
$("#portalFile").onchange=e=>ingest(e.target.files[0],"portal",m=>$("#portalMsg").textContent=m);
$("#inFile").onchange=e=>ingest(e.target.files[0],"website",m=>{});
$("#docs").onclick=e=>{const tr=e.target.closest("tr");if(tr){cur=tr.dataset.id;showDoc(cur)}};
function showDoc(id){
 const d=docs.find(x=>x.id==id);if(!d)return;$("#rev").hidden=false;
 $("#prev").innerHTML=d.url?(d.mime=="application/pdf"?`<object data="${d.url}" type="application/pdf"></object>`:`<img src="${d.url}" alt="">`):`<p class="note">${esc(d.name)}</p>`;
 const x=d.data||{},c=x.field_confidence||{},fl=x.validation_flags||[],ro=d.status!="pending_review";
 const val=k=>{const v=x[k];return v&&typeof v=="object"?v.name:v};
 const rows=Object.keys(T[L].f).map(k=>{const cf=c[k];return `<div class="f"><label for="f_${k}">${t("f")[k]}</label><input id="f_${k}" data-k="${k}" value="${esc(val(k))}" class="${cf!=null&&cf<.8?"low":""}" ${ro?"disabled":""}><span class="conf">${cf!=null?Math.round(cf*100)+"%":""}</span></div>`}).join("");
 $("#fields").innerHTML=(fl.length?`<div class="flag"><b>${t("flags")}</b><br>${fl.map(esc).join("<br>")}</div>`:"")+rows+
 `<div class="row"><button class="btn" data-a="verified" ${ro?"disabled":""}>${t("verify")}</button><button class="btn alt" data-a="pending_approval" ${d.status=="verified"?"":"disabled"}>${t("submit")}</button><button class="btn alt" data-a="rejected" ${ro?"disabled":""}>${t("reject")}</button></div><p class="note">${t("hint")}</p>`;
}
$("#fields").onclick=e=>{const a=e.target.dataset.a;if(!a)return;const d=docs.find(x=>x.id==cur);
 if(a=="verified"&&d.data)document.querySelectorAll("#fields [data-k]").forEach(i=>{const k=i.dataset.k,o=d.data[k];if(o&&typeof o=="object")o.name=i.value;else d.data[k]=i.value||null});
 d.status=a;sv("docs",docs.map(x=>({...x,url:null})));render()};
render();
</script>
</body>
</html>
